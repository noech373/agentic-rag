[[questions]]
id = "non-eu-company-gdpr-scope"
category = "factual"
origin = "blind"
question = "We're a US company selling online to customers in France. Does the GDPR apply to us?"
answer = "Yes: the GDPR applies to a controller not established in the Union when it processes the personal data of people who are in the Union in connection with offering them goods or services, paid or not (GDPR, Article 3(2)(a)). The company must then designate in writing a representative in the Union, unless its processing is only occasional and unlikely to result in a risk (Article 27)."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "by a controller or processor not established in the Union, where the processing activities are related to" },
  { document = "gdpr", quote = "not established in the Union should be subject to this Regulation where the processing activities are related to offering goods or services" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "Where Article 3(2) applies, the controller or the processor shall designate in writing a representative in the Union" },
  { document = "gdpr", quote = "the controller or the processor should designate a representative, unless the processing is occasional" },
  { document = "edpb-guidelines-2022-09", quote = "Article 27 GDPR requires a controller (and a processor) to designate a representative in the EU" },
