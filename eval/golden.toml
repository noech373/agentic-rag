origin = "passage"
holdout = true
question = "Under the Data Act, can a national authority force our bank to hand over the data it holds during a crisis?"
answer = "Yes, under the Data Act, if it demonstrates an exceptional need: data holders that are legal persons must make data available, upon a duly reasoned request, to a public sector body, the Commission, the European Central Bank or a Union body that demonstrates an exceptional need to use them for its statutory duties in the public interest (Data Act, Article 14). In a crisis, that need exists where the data are necessary to respond to a public emergency and the body cannot obtain them by other means in a timely and effective manner (Article 15(1)(a)). A public emergency is an exceptional, time-limited situation, which can include a risk to financial stability, determined or officially declared under Union or national law (Article 2(29)). Outside a declared emergency, only non-personal data can be requested, for a specific task provided for by law, once the body has exhausted all other means, such as buying them at market rates (Article 15(1)(b)); this second case does not apply to micro and small enterprises (Article 15(2)). For an emergency request, the bank may decline or seek modification within five working days on limited grounds (Article 18(2)), and must provide the data free of charge unless it is a micro or small enterprise (Article 20(1)). This framework does not affect existing reporting obligations, nor requests for the prosecution of offences, customs or tax purposes (Article 16)."

