  { document = "gdpr", quote = "That right should be explicitly brought to the attention of the data subject and presented clearly and separately from any other information." },
]

[[questions]]
id = "bundled-consent-gym"
category = "vague"
origin = "blind"
question = "My gym says I can only sign up if I agree to them passing my data on to partner brands. Does my 'yes' really count?"
answer = "Probably not. Consent must be freely given (Article 4(11)). When assessing whether it is, utmost account is taken of whether the provision of a service is made conditional on consent to processing that is not necessary for it (Article 7(4)); consent is presumed not freely given in that case (recital 43). Sharing your data with partner brands is not necessary to provide a gym membership, and consent is not freely given if you have no genuine or free choice (recital 42)."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "any freely given, specific, informed and unambiguous indication of the data subject's wishes" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "is conditional on consent to the processing of personal data that is not necessary for the performance of that contract" },
  { document = "gdpr", quote = "is dependent on the consent despite such consent not being necessary for such performance" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "Consent should not be regarded as freely given if the data subject has no genuine or free choice" },
]

[[questions]]
id = "scrolling-as-consent"
category = "vague"
origin = "blind"
holdout = true
question = "If a user just keeps scrolling on my site, can I count that as a yes to tracking?"
answer = "No. Consent must be an unambiguous indication of the user's wishes, given by a statement or a clear affirmative action (GDPR, Art. 4(11)). Continuing to scroll is ordinary use of the site, not conduct that clearly signals agreement to tracking; the GDPR also states that silence or inactivity cannot constitute consent (recital 32)."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "by a statement or by a clear affirmative action, signifies agreement to the processing of personal data" },
  { document = "gdpr", quote = "Consent should be given by a clear affirmative act establishing a freely given, specific, informed and unambiguous indication" },
  { document = "gdpr", quote = "Silence, pre-ticked boxes or inactivity should not therefore constitute consent" },
]

[[questions]]
id = "consent-withdrawal"
category = "factual"
origin = "passage"
question = "Can a data subject withdraw consent, and does withdrawal make the processing done before it unlawful?"
answer = "Yes, the data subject can withdraw consent at any time, and withdrawing must be as easy as giving consent. Withdrawal does not affect the lawfulness of processing based on consent before the withdrawal (Article 7(3))."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "The data subject shall have the right to withdraw his or her consent at any time." },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "The withdrawal of consent shall not affect the lawfulness of processing based on consent before its withdrawal." },
  { document = "gdpr", quote = "the existence of the right to withdraw consent at any time, without affecting the lawfulness of processing based on consent before its withdrawal" },
]

[[questions]]
id = "child-consent-age"
category = "factual"
origin = "passage"
question = "From what age can a child consent alone to an online service, and how low can a Member State set that age?"
answer = "For information society services offered directly to a child, the child can consent alone from 16 years old; below that, consent must be given or authorised by the holder of parental responsibility. Member States may set a lower age by law, but not below 13 years (Article 8(1))."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "the processing of the personal data of a child shall be lawful where the child is at least 16 years old" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "Member States may provide by law for a lower age for those purposes provided that such lower age is not below 13 years." },
]


# --- GDPR: rights of the data subject ---

[[questions]]
id = "erasure-legal-obligation"
category = "factual"
origin = "passage"
question = "Does the right to erasure apply when the controller processes personal data on the basis of a legal obligation?"
answer = "No, not to the extent that the processing is necessary to comply with that legal obligation."

