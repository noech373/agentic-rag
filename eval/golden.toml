# --- GDPR: impact assessment ---

[[questions]]
id = "dpia-when-required"
category = "factual"
origin = "passage"
question = "When must a data protection impact assessment be carried out, and which cases are explicitly listed?"
answer = "A DPIA must be carried out before the processing when a type of processing, in particular using new technologies, is likely to result in a high risk to the rights and freedoms of natural persons (Article 35(1)). Article 35(3) explicitly lists three cases: (a) a systematic and extensive evaluation of personal aspects based on automated processing, including profiling, on which decisions with legal or similarly significant effects are based; (b) large-scale processing of special categories of data (Article 9(1)) or of data on criminal convictions and offences (Article 10); (c) systematic monitoring of a publicly accessible area on a large scale."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "prior to the processing, carry out an assessment of the impact of the envisaged processing operations on the protection of personal data" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "a systematic and extensive evaluation of personal aspects relating to natural persons which is based on automated processing, including profiling" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "processing on a large scale of special categories of data referred to in Article 9(1)" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "a systematic monitoring of a publicly accessible area on a large scale" },
]

[[questions]]
id = "dpia-minimum-content"
category = "factual"
origin = "passage"
question = "What must a DPIA contain at a minimum?"
answer = "Under Article 35(7), a DPIA must contain at least: (a) a systematic description of the envisaged processing operations and their purposes, including the legitimate interest pursued where applicable; (b) an assessment of the necessity and proportionality of the processing in relation to the purposes; (c) an assessment of the risks to the rights and freedoms of data subjects; (d) the measures envisaged to address the risks, including safeguards, security measures and mechanisms to protect personal data and demonstrate compliance."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "a systematic description of the envisaged processing operations and the purposes of the processing" },
]

[[questions.evidence]]
any_of = [
