  { document = "gdpr", quote = "those that render the personal data unintelligible to any person who is not authorised to access it, such as encryption" },
  { document = "edpb-guidelines-2022-09", quote = "Article 34(3) GDPR states three conditions that, if met, do not require notification to individuals" },
]

[[questions.evidence]]
