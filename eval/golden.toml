question = "We supply ATMs to banks. Under the Data Act, can we use the data the machines generate to train our predictive maintenance models without the banks' agreement?"
answer = "No. A data holder may only use readily available non-personal data on the basis of a contract with the user, here the bank (Data Act, Article 4(13), recital 25); the purposes of such use must be disclosed to the bank before the contract for the related service is concluded (Article 3(3)(c)). Even with such a contract, you must not use the data to derive insights about the bank's economic situation, assets, production methods or use in a way that could undermine its commercial position (Article 4(13)), nor make non-personal product data available to third parties for purposes other than fulfilling your contract with the bank (Article 4(14)). Personal data in the machine data remain governed by the GDPR. These rules do not apply if you are a micro or small enterprise without a larger partner or linked enterprise (Article 7(1))."

