[[questions]]
id = "employee-leaving-assets"
category = "factual"
origin = "passage"
question = "When an employee leaves, what do we have to do with the laptop and accounts they had?"
answer = "The assets in the employee's custody must be deposited, returned or deleted upon termination of employment, and this must be documented; where that is not possible, make sure the assets can no longer access the network and information systems (ENISA guidance, 12.5). Their access rights must also be modified accordingly (ENISA guidance, 11.2.2(b))."

