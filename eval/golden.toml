[[questions]]
id = "supplier-security-check"
category = "multi-document"
origin = "passage"
question = "How should we check the security of our suppliers?"
answer = """
Under NIS2, supply chain security is one of the minimum cybersecurity risk-management measures: it covers the security aspects of your relationship with each direct supplier and service provider (Article 21(2)(d)). When choosing these measures, you must take into account the vulnerabilities specific to each supplier, the overall quality of their products, their cybersecurity practices, including their secure development procedures, and the results of the EU-level coordinated security risk assessments of critical supply chains (Article 21(3)).
In practice, this takes the form of a supply chain security policy governing your relations with direct suppliers and service providers (Implementing Regulation (EU) 2024/2690, Annex, points 5.1 and 5.2, as detailed in the ENISA technical implementation guidance). The policy lays down criteria for selecting and contracting suppliers: besides their cybersecurity practices and the quality and resilience of their ICT products and services, these include their ability to meet your security specifications and your ability to diversify sources and limit vendor lock-in. ENISA also recommends a risk analysis before signing any agreement. Contracts, where appropriate through SLAs, should include an obligation for suppliers to notify you of incidents without undue delay and a right to audit or to receive audit reports. Throughout the relationship, keep an up-to-date registry of your direct suppliers, monitor SLA reports, review incidents involving their products and services, and monitor and evaluate changes in their cybersecurity practices at planned intervals, acting on them where necessary.
"""

