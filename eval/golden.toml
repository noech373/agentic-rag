category = "vague"
origin = "blind"
question = "Our ATMs send us raw sensor readings and error logs, and we compute failure predictions from them with our own algorithms. Under the EU rules on access to connected-device data, which of these must we hand over to the bank that uses the machines?"
answer = "The raw and pre-processed data: readings generated automatically by sensors and data recorded by embedded applications, including those indicating hardware status and malfunctions, are product data the bank must be able to access, with the metadata needed to interpret them (Data Act, Article 2(15), Article 4(1), recital 15). Your failure predictions are in principle not covered: information inferred or derived from the data as the outcome of additional investments, in particular by means of proprietary, complex algorithms, falls outside the scope of the Regulation, unless otherwise agreed with the user (recital 15). This exclusion is stated in a recital, not an article, and only holds if the predictions do result from such investments; processing that merely makes raw data understandable and usable remains in scope."

