category = "vague"
origin = "blind"
holdout = true
question = "I run an online shop. Can I use my customers' details to send them promotions without asking them first, and what can they do if they don't want them?"
answer = "Under the GDPR, processing personal data for direct marketing may be regarded as carried out for a legitimate interest (recital 47), so consent is not the only possible basis. But customers have the right to object at any time to processing for direct marketing, including related profiling (Article 21(2)), free of charge (recital 70); once they object, their data can no longer be processed for that purpose (Article 21(3)). This right must be explicitly brought to their attention, at the latest at the first communication, clearly and separately from any other information (Article 21(4))."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "The processing of personal data for direct marketing purposes may be regarded as carried out for a legitimate interest." },
]

[[questions.evidence]]
