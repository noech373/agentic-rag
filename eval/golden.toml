]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "an assessment of the risks to the rights and freedoms of data subjects referred to in paragraph 1" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "the measures envisaged to address the risks, including safeguards, security measures and mechanisms to ensure the protection of personal data" },
  { document = "gdpr", quote = "That impact assessment should include, in particular, the measures, safeguards and mechanisms envisaged for mitigating that risk" },
