category = "factual"
origin = "passage"
question = "We manufacture ATMs for banks. Under the Data Act, can we refuse to give a bank its machines' data because the data would reveal our trade secrets?"
answer = "Not by default. Trade secrets are preserved, but disclosed once you and the bank agree, before disclosure, on proportionate technical and organisational measures to keep them confidential, such as confidentiality agreements or strict access protocols; you must identify the data protected as trade secrets (Data Act, Article 4(6)). You may withhold or suspend the sharing of those data only if no agreement is reached on such measures, or the bank fails to implement them or undermines their confidentiality (Article 4(7)). You may refuse outright only in exceptional circumstances, case by case, if you can demonstrate on objective elements that you are highly likely to suffer serious economic damage despite the measures (Article 4(8)). In both cases the decision must be substantiated in writing to the bank and notified to the competent authority; the bank can challenge it before the competent authority, a dispute settlement body or a court (Article 4(9))."

