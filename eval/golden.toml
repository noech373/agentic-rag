# Golden set: questions with the passages that answer them, to measure the retrieval.
#
# A passage is a short verbatim quote (4 to 25 words), not a chunk id, so the set outlives any
# change to the parsing or the chunking. A retrieved chunk is relevant when it contains a quote
# whole, ignoring case, punctuation and spacing, in whatever document: a guideline that quotes
# the GDPR word for word answers as well as the GDPR. But no quote is in a document of another
# regulation: a NIS2 guideline that copies a DORA clause does not answer a DORA question.
# A check mark in a table counts as a word: ✔ (or ✓) is "yes", ✘ (or ✗) is "no".
#
# category: factual | vague | table | multi-document | unanswerable
#           factual: asks for a precise fact (deadline, amount, definition, list) in words close
#           to the text's;
#           vague: describes a situation in the user's own words, without the legal term the
#           answer rests on ("guess how my coworkers feel" for "emotion recognition");
#           table: at least one fact of the answer is stated only in a table;
#           multi-document: the facts of the answer come from two documents or more (the sheets
#           of the CNIL guide are one document);
#           unanswerable: the corpus does not answer it.
# origin:   passage | blind
#           passage: written while reading a passage, by hand or by an AI;
#           blind: written without reading the corpus, as a user would. Comparing the scores
#           of the two shows whether the questions written from a passage are easier.
# holdout:  true for a fifth of each category, drawn at random once, then rebalanced on origin,
#           documents and chunks shared with the other questions. Tuning never looks at them:
#           they are scored only for the final results. Default: false.
# evidence: one [[questions.evidence]] per fact needed to answer the question as asked: a caveat
#           it does not ask for gets none, even if `answer` mentions it. `any_of` lists passages
#           that state this fact: one of them is enough (several when documents state it in
#           different words). `document` is where the quote was taken from.
# An unanswerable question has no evidence, and its answer is the RAG's exact refusal.
# Questions are grouped by the text they are mainly about.
#
# Check: uv run pytest tests/evaluation/test_golden.py


# --- GDPR: scope and personal data ---

[[questions]]
id = "non-eu-company-gdpr-scope"
category = "factual"
origin = "blind"
holdout = true
question = "We're a US company selling online to customers in France. Does the GDPR apply to us?"
answer = "Yes: the GDPR applies to a controller not established in the Union when it processes the personal data of people who are in the Union in connection with offering them goods or services, whether or not payment is required (GDPR, Article 3(2)(a))."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "by a controller or processor not established in the Union, where the processing activities are related to" },
  { document = "gdpr", quote = "not established in the Union should be subject to this Regulation where the processing activities are related to offering goods or services" },
]

[[questions]]
id = "ip-addresses-personal-data"
category = "factual"
origin = "passage"
question = "Do I need to treat my visitors' IP addresses as private information?"
answer = "Yes: your visitors' IP addresses are personal data under the GDPR. An IP address is an online identifier which, combined with other information received by servers, can be used to create profiles of people and identify them (GDPR, recital 30), and personal data covers any information relating to a person identifiable by reference to an identifier such as an online identifier (Article 4(1)). The CNIL lists the IP address among examples of personal data where it relates to natural persons."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "online identifiers provided by their devices, applications, tools and protocols, such as internet protocol addresses" },
  { document = "cnil-developer-guide-01", quote = "IP address, computer connection identifier or cookie identifier" },
]


# --- GDPR: lawful bases and consent ---

[[questions]]
id = "lawful-bases"
category = "factual"
origin = "passage"
question = "What are the lawful bases on which personal data may be processed under the GDPR?"
answer = "Processing is lawful only if at least one of six bases applies (Article 6(1)): (a) the data subject's consent for one or more specific purposes; (b) necessity for the performance of a contract with the data subject or for pre-contractual steps at their request; (c) compliance with a legal obligation of the controller; (d) protection of the vital interests of the data subject or another natural person; (e) performance of a task carried out in the public interest or in the exercise of official authority vested in the controller; (f) the legitimate interests of the controller or a third party, unless overridden by the data subject's interests or fundamental rights and freedoms."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "the data subject has given consent to the processing of his or her personal data for one or more specific purposes" },
  { document = "cnil-developer-guide-15", quote = "the data subject has given his or her explicit consent to the processing" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "processing is necessary for the performance of a contract to which the data subject is party" },
  { document = "cnil-developer-guide-15", quote = "the processing is necessary for the performance or preparation of a contract between the data subject and the body" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "processing is necessary for compliance with a legal obligation to which the controller is subject" },
  { document = "cnil-developer-guide-15", quote = "The legal obligation: the processing is imposed by regulatory texts" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "processing is necessary in order to protect the vital interests of the data subject or of another natural person" },
  { document = "cnil-developer-guide-15", quote = "protect of vital interests may be used as a legal basis" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "processing is necessary for the performance of a task carried out in the public interest" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "processing is necessary for the purposes of the legitimate interests pursued by the controller or by a third party" },
  { document = "cnil-developer-guide-15", quote = "the organization has a \"legitimate\" interest in carrying out the processing" },
]

[[questions]]
id = "public-authority-legitimate-interest"
category = "factual"
origin = "passage"
question = "Can a public authority rely on legitimate interests as the legal basis when it performs its tasks?"
answer = "No. Legitimate interests (point (f) of Article 6(1)) does not apply to processing carried out by public authorities in the performance of their tasks (Article 6(1), second subparagraph). Recital 47 explains that it is for the legislator to provide the legal basis for public authorities' processing."

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "Point (f) of the first subparagraph shall not apply to processing carried out by public authorities in the performance of their tasks." },
  { document = "gdpr", quote = "that legal basis should not apply to the processing by public authorities in the performance of their tasks" },
]

[[questions]]
