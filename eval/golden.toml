# --- Data Act: contracts, public bodies and cloud switching ---

[[questions]]
id = "data-act-unfair-liability-clause"
category = "factual"
origin = "passage"
question = "A large data vendor won't change a word of its standard contract with our bank, even though we pushed back, and one clause excludes its liability even for gross negligence. Is that clause valid under the Data Act?"
answer = "No, it is not binding on the bank. A contractual term on access to and use of data, or on liability for data-related obligations, that one enterprise unilaterally imposes on another is not binding if it is unfair (Data Act, Article 13(1)), and a term that excludes or limits the liability of the imposing party for intentional acts or gross negligence is always unfair (Article 13(4)(a)). A term is unilaterally imposed when the bank could not influence its content despite an attempt to negotiate it; the vendor bears the burden of proving otherwise (Article 13(6)). If the clause is severable, the rest of the contract remains binding (Article 13(7)). These rules apply to contracts concluded after 12 September 2025, and from 12 September 2027 to earlier contracts of indefinite duration or due to expire at least 10 years from 11 January 2024 (Article 50)."

