[[questions]]
id = "bank-breach-who-to-notify"
category = "multi-document"
origin = "passage"
question = "A hacker got into our bank's customer database. Do we report to the financial regulator, the data protection authority, or both?"
answer = "Both, under two separate obligations: a major ICT-related incident must be reported to the competent financial authority (DORA, Article 19(1)), and a personal data breach must be notified to the supervisory authority without undue delay and, where feasible, within 72 hours of becoming aware of it (GDPR, Article 33(1))."

[[questions.evidence]]
any_of = [
  { document = "dora", quote = "Financial entities shall report major ICT-related incidents to the relevant competent authority" },
  { document = "esas-dora-incident-reporting", quote = "FEs shall report major ICT-related incidents to the relevant competent authority" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority" },
  { document = "gdpr", quote = "where feasible, not later than 72 hours" },
  { document = "edpb-guidelines-2021-01", quote = "where feasible, not later than after 72 hours" },
  { document = "cnil-developer-guide-12", quote = "report the violation to the local data protection agency within 72 hours" },
  { document = "esas-dora-incident-reporting", quote = "(GDPR) within 72 hours of its detection" },
]

[[questions]]
id = "cloud-provider-contract-content"
category = "multi-document"
origin = "passage"
question = "We outsource customer-data processing to a cloud provider. What must the contract cover?"
answer = "Under the GDPR, the contract must set out the subject-matter, duration, nature and purpose of the processing and stipulate, among other things, that the processor acts only on the controller's documented instructions (Article 28(3)). If you are a financial entity, DORA adds at least a clear description of the functions and ICT services, and the locations where they are provided and where data is processed (Article 30(2))."

