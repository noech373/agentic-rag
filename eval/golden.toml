# --- GDPR: fines ---

[[questions]]
id = "max-fines"
category = "factual"
origin = "passage"
question = "What are the maximum administrative fines under the GDPR?"
answer = "There are two tiers. Up to EUR 10 million or, for an undertaking, up to 2 % of total worldwide annual turnover of the preceding financial year, whichever is higher, for infringements such as the obligations of controllers and processors (Article 83(4)). Up to EUR 20 million or 4 % of worldwide annual turnover, whichever is higher, for infringements of the basic principles, consent conditions, data subjects' rights, international transfers, and for non-compliance with a supervisory authority's order (Article 83(5) and (6))."

