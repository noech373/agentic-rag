  { document = "gdpr", quote = "up to 10 000 000 EUR, or in the case of an undertaking, up to 2 % of the total worldwide annual turnover" },
]

[[questions.evidence]]
any_of = [
  { document = "gdpr", quote = "up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of the total worldwide annual turnover" },
]

