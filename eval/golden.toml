origin = "blind"
question = "We sell a cloud platform to banks. Under the Data Act, what must we tell a bank about switching to another provider before it signs?"
answer = "You must make the written contract, which sets out the switching rights and obligations, available before signing, in a way that lets the bank store and reproduce it (Data Act, Article 25(1)); it must include at least a notice period of no more than two months, a transitional period of no more than 30 calendar days, the categories of data and digital assets that can be ported, a data retrieval period of at least 30 days and the applicable switching charges (Article 25(2)). Before entering into the contract, you must also give clear information on the standard service fees, the early termination penalties and the reduced switching charges that may apply until 12 January 2027 (Article 29(4)), and, where relevant, on services whose switching is highly complex or costly (Article 29(5)). You must inform the customer of the available switching and porting procedures, methods and formats, with their known restrictions and technical limitations, and refer it to an up-to-date online register of the data structures, formats and standards in which its exportable data are available (Article 26). Your contracts must also list the website where you publish the jurisdiction of your ICT infrastructure and your measures against unlawful foreign governmental access (Article 28). If your service is custom-built for an individual customer, you must tell the bank before signing which switching obligations do not apply (Article 31(3))."

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "The provider of data processing services shall make that contract available to the customer prior to signing the contract" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "clear information on the standard service fees and early termination penalties that might be imposed" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "information on available procedures for switching and porting to the data processing service" },
]

[[questions]]
id = "data-act-bank-cloud-functional-equivalence"
category = "vague"
origin = "blind"
question = "We are a bank moving from our cloud provider to a competitor. Does the Data Act oblige the old provider to help us get the same functionality running at the new one?"
answer = "It depends on the type of service. For infrastructure services (servers, networks and virtual resources, without the software running on them), the source provider must take all reasonable measures to help you achieve functional equivalence at the destination, by providing capabilities, adequate information, documentation, technical support and, where appropriate, tools (Data Act, Article 30(1)). For other services, it must make open interfaces available free of charge (Article 30(2)), ensure compatibility with common specifications or harmonised interoperability standards at the latest 12 months after their references are published in the Union repository (Article 30(3)) and, until then, export all exportable data in a structured, commonly used and machine-readable format on request (Article 30(5)). For all services, the contract must oblige the provider to give reasonable assistance during the switching process and to maintain business continuity (Article 25(2)(a)). The provider must not put obstacles in the way of switching, but it is not required to develop new technologies or to disclose digital assets protected by intellectual property rights or trade secrets (Articles 23 and 30(6)). The functional equivalence obligation does not apply to services custom-built for an individual customer (Article 31(1))."

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "achieves functional equivalence in the use of the destination data processing service" },
  { document = "data-act", quote = "should take all reasonable measures within its power to facilitate the process of achieving functional equivalence" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "shall make open interfaces available to an equal extent to all their customers" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "provide reasonable assistance to the customer and third parties authorised by the customer in the switching process" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "shall not be required to develop new technologies or services" },
  { document = "data-act", quote = "This Regulation does not require providers of data processing services to develop new categories of data processing services" },
]

[[questions]]
id = "data-act-cloud-foreign-government-access"
category = "factual"
origin = "passage"
question = "We host data for EU banks on our cloud. A non-EU government orders us to hand over some of their non-personal data. What does the Data Act require of us?"
answer = "You must take all adequate technical, organisational and legal measures, including contracts, to prevent third-country governmental access to non-personal data held in the Union where it would conflict with Union or national law (Data Act, Article 32(1)). The order is recognised or enforceable only if based on an international agreement, such as a mutual legal assistance treaty (Article 32(2)). Otherwise, where complying would risk a conflict with Union or national law, access may take place only if the third-country system requires a reasoned, proportionate and specific decision, your reasoned objection can be reviewed by a competent court of that country, and that court can take the protected interests into account (Article 32(3)); you may ask the competent national body for its opinion, and may reject the request if it finds these conditions unmet or does not reply within one month. If you comply, you must provide the minimum amount of data permissible, and inform the bank of the request before complying, unless it serves law enforcement purposes and only for as long as necessary to preserve their effectiveness (Article 32(4) and (5)). Personal data are governed by the GDPR instead."

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "take all adequate technical, organisational and legal measures, including contracts, in order to prevent international and third-country governmental access" },
  { document = "data-act", quote = "should take all reasonable measures to prevent access to systems on which non-personal data are stored" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "only if based on an international agreement, such as a mutual legal assistance treaty" },
  { document = "data-act", quote = "should be enforceable when based on an international agreement, such as a mutual legal assistance treaty" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "shall provide the minimum amount of data permissible in response to a request" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "inform the customer about the existence of a request of a third-country authority to access its data before complying" },
  { document = "data-act", quote = "should be able to inform the customer whose data are being requested before granting access to those data" },
]

[[questions]]
id = "data-act-application-dates"
category = "factual"
origin = "blind"
question = "We are a bank. From when does the EU regulation on fair access to and use of data apply, and from when can our cloud provider no longer charge us for switching?"
answer = "The Data Act applies from 12 September 2025, with staggered dates for some provisions: the design obligation of Article 3(1) applies to connected products placed on the market after 12 September 2026, and the rules on unfair terms apply from 12 September 2027 to some contracts concluded before 12 September 2025 (Article 50). Until 12 January 2027, cloud providers may only impose reduced switching charges, which cannot exceed the costs directly linked to the switching process; from 12 January 2027 they may not impose any switching charges at all (Article 29(1) to (3)). This does not cover standard service fees or early termination penalties, which are not switching charges (Article 2(36)), nor data egress charges at cost for in-parallel use of several providers (Article 34(2))."

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "It shall apply from 12 September 2025." },
  { document = "data-act", quote = "those rules should apply from 12 September 2025" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "From 12 January 2027, providers of data processing services shall not impose any switching charges" },
  { document = "data-act", quote = "Switching charges should therefore be abolished after three years from the date of entry into force of this Regulation" },
]

[[questions.evidence]]
any_of = [
  { document = "data-act", quote = "may impose reduced switching charges on the customer for the switching process" },
]


# --- Across texts ---

[[questions]]
id = "bank-breach-who-to-notify"
category = "multi-document"
origin = "passage"
holdout = true
question = "A hacker got into our bank's customer database. Do we report to the financial regulator, the data protection authority, or both?"
answer = "Both, under two separate obligations: a major ICT-related incident must be reported to the competent financial authority (DORA, Article 19(1)), and a personal data breach must be notified to the supervisory authority without undue delay and, where feasible, within 72 hours of becoming aware of it (GDPR, Article 33(1))."

