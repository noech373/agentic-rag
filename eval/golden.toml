category = "multi-document"
origin = "passage"
holdout = true
question = "Under NIS2, how should we check the security of our suppliers?"
answer = "Under NIS2, supply chain security is one of the minimum cybersecurity risk-management measures: it covers the security aspects of your relationship with each direct supplier and service provider (Article 21(2)(d)). When choosing these measures, you must take into account the overall quality of your suppliers' products and their cybersecurity practices, including their secure development procedures (Article 21(3)). In practice, this takes the form of a supply chain security policy governing your relations with direct suppliers and service providers (Implementing Regulation (EU) 2024/2690, Annex, points 5.1 and 5.2, as detailed in the ENISA technical implementation guidance). Contracts should include an obligation for suppliers to notify you of incidents without undue delay, and you must keep an up-to-date registry of your direct suppliers and service providers. You must also monitor, evaluate and act upon changes in your suppliers' cybersecurity practices, at planned intervals and after significant changes or incidents, for example by following the reports on service level agreements and reviewing incidents caused by their products and services (points 5.1.6 and 5.1.7)."

