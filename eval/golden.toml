[[questions]]
id = "breach-no-notification-individuals"
category = "factual"
origin = "blind"
question = "Are there situations where I don't need to inform the individuals concerned by a breach?"
answer = "Yes: communication to the data subjects is not required if the controller applied appropriate protection measures to the affected data (such as encryption), took subsequent measures that ensure the high risk is no longer likely to materialise, or if it would involve disproportionate effort, in which case a public communication is made instead (GDPR, Article 34(3))."

