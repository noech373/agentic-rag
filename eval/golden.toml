# --- GDPR: data protection officer ---

[[questions]]
id = "dpo-mandatory-cases"
category = "factual"
origin = "passage"
question = "In which cases is it mandatory to designate a data protection officer?"
answer = "Under Article 37(1), the controller and processor must designate a DPO where: (a) the processing is carried out by a public authority or body, except courts acting in their judicial capacity; (b) their core activities consist of processing operations which require regular and systematic monitoring of data subjects on a large scale; or (c) their core activities consist of large-scale processing of special categories of data (Article 9) and data on criminal convictions and offences (Article 10). Union or Member State law may also make designation mandatory in other cases (Article 37(4))."

[[questions.evidence]]
any_of = [
