[[chunks]]
question_id = "data-act-cloud-foreign-government-access"
chunk = "data-act#132"
question = "We host data for EU banks on our cloud. A non-EU government orders us to hand over some of their non-personal data. What does the Data Act require of us?"
answer = "You must take all adequate technical, organisational and legal measures, including contracts, to prevent third-country governmental access to non-personal data held in the Union where it would conflict with Union or national law (Data Act, Article 32(1)). The order is recognised or enforceable only if based on an international agreement, such as a mutual legal assistance treaty (Article 32(2)). Otherwise, where complying would risk a conflict with Union or national law, access may take place only if the third-country system requires a reasoned, proportionate and specific decision, your reasoned objection can be reviewed by a competent court of that country, and that court can take the protected interests into account (Article 32(3)); you may ask the competent national body for its opinion, and may reject the request if it finds these conditions unmet or does not reply within one month. If you comply, you must provide the minimum amount of data permissible, and inform the bank of the request before complying, unless it serves law enforcement purposes and only for as long as necessary to preserve their effectiveness (Article 32(4) and (5)). Personal data are governed by the GDPR instead."
facts = [
  "take all adequate technical, organisational and legal measures, including contracts, in order to prevent international and third-country governmental access | should take all reasonable measures to prevent access to systems on which non-personal data are stored",
  "only if based on an international agreement, such as a mutual legal assistance treaty | should be enforceable when based on an international agreement, such as a mutual legal assistance treaty",
  "shall provide the minimum amount of data permissible in response to a request",
  "inform the customer about the existence of a request of a third-country authority to access its data before complying | should be able to inform the customer whose data are being requested before granting access to those data",
]
location = "Data Act, Article 5"
text = '''
1. Upon request by a user, or by a party acting on behalf of a user, the data holder shall make available readily available data, as well as the relevant metadata necessary to interpret and use those data, to a third party without undue delay, of the same quality as is available to the data holder, easily, securely, free of charge to the user, in a comprehensive, structured, commonly used and machine-readable format and, where relevant and technically feasible, continuously and in real-time. The data shall be made available by the data holder to the third party in accordance with Articles 8 and 9.
2. Paragraph 1 shall not apply to readily available data in the context of the testing of new connected products, substances or processes that are not yet placed on the market unless their use by a third party is contractually permitted.
3. Any undertaking designated as a gatekeeper, pursuant to Article 3 of Regulation (EU) 2022/1925, shall not be an eligible third party under this Article and therefore shall not:
(a) solicit or commercially incentivise a user in any manner, including by providing monetary or any other compensation, to make data available to one of its services that the user has obtained pursuant to a request under Article 4(1);
(b) solicit or commercially incentivise a user to request the data holder to make data available to one of its services pursuant to paragraph 1 of this Article;
(c) receive data from a user that the user has obtained pursuant to a request under Article 4(1).
4. For the purpose of verifying whether a natural or legal person qualifies as a user or as a third party for the purposes of paragraph 1, the user or the third party shall not be required to provide any information beyond what is necessary. Data holders shall not keep any information on the third party’s access to the data requested beyond what is necessary for the sound execution of the third party’s access request and for the security and maintenance of the data infrastructure.
5. The third party shall not use coercive means or abuse gaps in the technical infrastructure of a data holder which is designed to protect the data in order to obtain access to data.'''
