[[chunks]]
question_id = "production-data-evaluation"
chunk = "ai-act#206"
question = "Can we use production data containing personal information to evaluate and fine-tune our models?"
answer = "Not as such: the CNIL says real production data should not be used during development and testing, because using personal data from production for testing diverts it from its original purpose and increases security risks. Build a dummy data set that looks like the real data instead, or anonymise the personal data imported from production (CNIL developer guide, sheet 11). The guide does not mention fine-tuning, which is likewise a use outside the data's original purpose."
