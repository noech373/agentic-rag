  "in case of pseudonymization these data remain subject to the regulations on personal data | Data resulting from pseudonymization are considered as personal data and therefore remain subject to the obligations of the GDPR | Personal data which have undergone pseudonymisation, which could be attributed to a natural person by the use of additional information",
