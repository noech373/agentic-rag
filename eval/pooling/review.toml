[[chunks]]
question_id = "data-act-bank-cloud-functional-equivalence"
chunk = "data-act#137"
question = "We are a bank moving from our cloud provider to a competitor. Does the Data Act oblige the old provider to help us get the same functionality running at the new one?"
answer = "It depends on the type of service. For infrastructure services (servers, networks and virtual resources, without the software running on them), the source provider must take all reasonable measures to help you achieve functional equivalence at the destination, by providing capabilities, adequate information, documentation, technical support and, where appropriate, tools (Data Act, Article 30(1)). For other services, it must make open interfaces available free of charge (Article 30(2)), ensure compatibility with common specifications or harmonised interoperability standards at the latest 12 months after their references are published in the Union repository (Article 30(3)) and, until then, export all exportable data in a structured, commonly used and machine-readable format on request (Article 30(5)). For all services, the contract must oblige the provider to give reasonable assistance during the switching process and to maintain business continuity (Article 25(2)(a)). The provider must not put obstacles in the way of switching, but it is not required to develop new technologies or to disclose digital assets protected by intellectual property rights or trade secrets (Articles 23 and 30(6)). The functional equivalence obligation does not apply to services custom-built for an individual customer (Article 31(1))."
facts = [
  "achieves functional equivalence in the use of the destination data processing service | should take all reasonable measures within its power to facilitate the process of achieving functional equivalence",
  "shall make open interfaces available to an equal extent to all their customers",
  "provide reasonable assistance to the customer and third parties authorised by the customer in the switching process",
  "shall not be required to develop new technologies or services | This Regulation does not require providers of data processing services to develop new categories of data processing services",
]
location = "Data Act, Article 8"
text = '''
1. Where, in business-to-business relations, a data holder is obliged to make data available to a data recipient under Article 5 or under other applicable Union law or national legislation adopted in accordance with Union law, it shall agree with a data recipient the arrangements for making the data available and shall do so under fair, reasonable and non-discriminatory terms and conditions and in a transparent manner in accordance with this Chapter and Chapter IV.
2. A contractual term concerning access to and the use of data, or liability and remedies for the breach or termination of data-related obligations, shall not be binding if it constitutes an unfair contractual term within the meaning of Article 13 or if, to the detriment of the user, it excludes the application of, derogates from or varies the effect of the user’s rights under Chapter II.
3. A data holder shall not discriminate regarding the arrangements for making data available between comparable categories of data recipients, including partner enterprises or linked enterprises of the data holder when making data available. Where a data recipient considers that the conditions under which data has been made available to it are discriminatory, the data holder shall without undue delay provide the data recipient, upon its reasoned request, with information showing that there has been no discrimination.
4. A data holder shall not make data available to a data recipient, including on an exclusive basis, unless requested to do so by the user under Chapter II.
5. Data holders and data recipients shall not be required to provide any information beyond what is necessary to verify compliance with the contractual terms agreed for making data available or with their obligations under this Regulation or other applicable Union law or national legislation adopted in accordance with Union law.
6. Unless otherwise provided for in Union law, including Article 4(6) and Article 5(9) of this Regulation, or by national legislation adopted in accordance with Union law, an obligation to make data available to a data recipient shall not oblige the disclosure of trade secrets.'''
verdict = "rejected"
fact = 0
quote = ""

