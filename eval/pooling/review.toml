question_id = "network-segmentation-evidence"
chunk = "enisa-nis2-implementation-guidance#226"
question = "Under NIS2, what proof could I give an auditor to show that my network is segmented?"
answer = "Documented segmentation rules based on standards (6.8.1); risk assessments justifying the segmentation, up-to-date network diagrams showing zones (DMZ, internal, guest), VLAN, router/switch and firewall configurations matching the documented rules (6.8.2); evidence of periodic review such as pentests/vulnerability scans covering segmentation and review schedules (6.8.3)."
facts = [
  "Up-to-date network diagrams showing segmentation into different networks or zones | Configuration settings that match documented segmentation rules and diagrams | Documented network segmentation rules based on relevant standards and good practices",
  "Penetration tests and vulnerability assessments that include evaluations of network segmentation | Plans or schedules for reviewing network segmentation rules",
]
location = "ENISA NIS2 implementation guidance, Point 13.3.2, p. 162"
text = '''
13.3.2. For that purpose, the relevant entities shall:
(a) on the basis of the risk assessment carried out pursuant to point 2.1, lay down and use security perimeters to protect areas where network and information systems and other associated assets are located;
(b) protect the areas referred to in point (a) by appropriate entry controls and access points;
(c) design and implement physical security for offices, rooms and facilities,
(d) continuously monitor their premises for unauthorised physical access.
GUIDANCE
· In the risk assessment, consider risks associated with unauthorised physical access to, damage to and interference with network and information systems.
TIPS
· Based on the results of the risk assessment, determine high-criticality assets and the impact of their being compromised. This will help in identifying the perimeter for such assets.
· Prevent unauthorised physical access to facilities and set up adequate measures.
o Physical access control measures designed to protect the entity as a whole will also protect individual assets.
o Consider introducing further specific access control measures for specific assets or facilities.
· Consider physical security measures (indicative, non-exhaustive list):
o physical access controls such as key cards, biometric scanners, locks and security personnel to restrict access to high-criticality areas,
o electronic control of entry, with an audit trail,
o segmentation of spaces or creation of zones according to authorization levels and their contents,
o CCTV cameras and monitoring systems to continuously observe sensitive areas,
o fencing, barriers and security patrols for securing physical perimeters,
o guards and/or alarms to monitor every physical access point to the facility where the information system resides, 24 hours per day, seven days per week.
· Develop and enforce procedures for granting, reviewing and revoking physical access rights (section 11.2).
o Identify a designated official within the entity to review and approve the list of personnel with authorized physical access.
o Maintain a list of personnel with authorized access to facilities, and their authorization levels.
EXAMPLES OF EVIDENCE
· Risk assessment results
· Existence of physical security measures
· Procedures for granting, reviewing and revoking physical access rights in accordance with point 11.2 in the Annex to the regulation.'''
