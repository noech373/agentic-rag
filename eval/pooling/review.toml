location = "EDPB Guidelines 01/2021, 3.3.1 CASE No. 07 - Prior measures and risk assessment, p. 18"
text = '''
63. It is important to mention that controllers handling data of highly personal nature 21 have a larger responsibility in terms of providing adequate data security, e.g. having a security operation's centre and other incident prevention, detection and response measures. Not meeting these higher standards will certainly result in more serious measures during an SA's investigation.
64. The breach concerns financial data beyond the identity and user ID information, making it particularly severe. The number of individuals affected is high.
65. The fact that a breach could happen in such a sensitive environment points to significant data security holes in the controller's system, and may be an indicator of a time when the review and update of affected measures is "necessary" in line with Articles 24 (1), 25 (1), and 32 (1) of the GDPR. The breached data permits the unique identification of data subjects and contains other information about them (including gender, date and place of birth), furthermore it can be used by the attacker to guess the customers' passwords or to run a spear phishing campaign directed at the bank customers.
66. For these reasons, the data breach was deemed likely to result in a high risk to the rights and freedoms of all the data subjects concerned 22 . Therefore, the occurrence of material (e.g. financial loss) and non-material damage (e.g. identity theft or fraud) is a conceivable outcome.'''
