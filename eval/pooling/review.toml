[[chunks]]
question_id = "erasure-vector-embeddings"
chunk = "cnil-developer-guide-14#1"
question = "When a user exercises their right to erasure, do I also need to delete their data from the embeddings stored in the vector database?"
answer = "Yes, in practice. The CNIL recommends providing a functionality to erase all data relating to a person, notifying processors so that they erase it too, and erasing it in backups as well, or making sure erased data are not restored (CNIL developer guide, sheet 13; GDPR Article 17). The sources do not mention embeddings, but personal data is any information relating to an identified or identifiable natural person (GDPR Article 4(1)): vectors computed from the person's data and stored with it are data relating to them, and should be erased with the source text."
facts = [
  "Provide a functionality to erase all data relating to a person. | the right to obtain from the controller the erasure of personal data concerning him or her without undue delay",
  "Provide for data erasure also in backups, or provide an alternative solution that does not restore erased data",
  "Also provide for automatic notification of processors to also erase the data relating to that person.",
  "any information relating to an identified or identifiable natural person",
]
location = "CNIL GDPR Developer Guide, Data retention cycles"
text = '''
* The personal data retention cycle can be divided into **three distinct successive phases**:
    * The active database;
    * Intermediate archiving;
    * Final archiving or deletion.
* The mechanisms for deleting personal data from the active bases ensure that the data are kept and accessible by the operational services only **for the time necessary to achieve the purpose of the processing operation**.
* Ensure that **data is not kept in active databases** by simply noting them **as being archived**. The archived data (intermediate archive) must be accessible only to a specific service responsible for accessing and removing them from the archive if necessary.
* Please also ensure that you have **specified access modes** for the archived data, as the use of an archive must be on an ad hoc and exceptional basis.
* If possible, use the same implementation when implementing the **data purging or anonymisation** as the one managing the **right to erasure** (see sheet on the exercise of rights), in order to guarantee a homogeneous operation of your system.'''
verdict = "rejected"
fact = 0
