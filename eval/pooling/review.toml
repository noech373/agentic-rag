[[chunks]]
question_id = "fines-records-and-access"
chunk = "gdpr#145"
question = "We never kept a list of what we do with personal data, and we ignored people asking to see their data. How much could we be fined?"
answer = "Not keeping a record of processing activities breaches Article 30, which falls under Article 83(4): up to EUR 10 million or 2 % of worldwide annual turnover, whichever is higher. Organisations with fewer than 250 employees are exempt from the record unless their processing is likely to result in a risk, is not occasional, or includes special categories or criminal data (Article 30(5)). Ignoring access requests breaches the data subjects' rights (Articles 12 to 22, including the right of access in Article 15), which falls under Article 83(5): up to EUR 20 million or 4 % of worldwide annual turnover, whichever is higher. If the infringements concern the same or linked processing operations, the total fine cannot exceed the amount for the gravest infringement (Article 83(3)). The actual amount depends on the criteria of Article 83(2)."
