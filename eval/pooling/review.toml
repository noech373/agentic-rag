answer = "Yes: medical records unavailable for 30 hours because of a cyber-attack must be notified to the supervisory authority, as a high risk to patients' well-being and privacy may occur, and the affected individuals must be told too (EDPB Guidelines 9/2022, example viii; EDPB Guidelines 01/2021, case 03)."
