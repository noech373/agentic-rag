[[chunks]]
question_id = "cctv-public-square-dpia"
chunk = "gdpr#219"
question = "We want to put cameras filming the whole square in front of our shopping centre. Is there something we have to assess before switching them on?"
answer = "Yes: a data protection impact assessment (DPIA). Systematic monitoring of a publicly accessible area on a large scale is one of the cases where a DPIA is explicitly required (Article 35(3)(c)), and recital 91 specifically mentions monitoring of publicly accessible areas using optic-electronic devices. The assessment must be carried out before the processing starts (Article 35(1))."
facts = [
  "a systematic monitoring of a publicly accessible area on a large scale | A data protection impact assessment is equally required for monitoring publicly accessible areas on a large scale, especially when using optic-electronic devices",
  "prior to the processing, carry out an assessment of the impact of the envisaged processing operations on the protection of personal data | a data protection impact assessment should be carried out by the controller prior to the processing",
]
location = "GDPR, Article 35"
text = '''
7. The assessment shall contain at least:
(a) a systematic description of the envisaged processing operations and the purposes of the processing, including, where applicable, the legitimate interest pursued by the controller;
(b) an assessment of the necessity and proportionality of the processing operations in relation to the purposes;
(c) an assessment of the risks to the rights and freedoms of data subjects referred to in paragraph 1; and
(d) the measures envisaged to address the risks, including safeguards, security measures and mechanisms to ensure the protection of personal data and to demonstrate compliance with this Regulation taking into account the rights and legitimate interests of data subjects and other persons concerned.
8. Compliance with approved codes of conduct referred to in Article 40 by the relevant controllers or processors shall be taken into due account in assessing the impact of the processing operations performed by such controllers or processors, in particular for the purposes of a data protection impact assessment.
9. Where appropriate, the controller shall seek the views of data subjects or their representatives on the intended processing, without prejudice to the protection of commercial or public interests or the security of processing operations.
10. Where processing pursuant to point (c) or (e) of Article 6(1) has a legal basis in Union law or in the law of the Member State to which the controller is subject, that law regulates the specific processing operation or set of operations in question, and a data protection impact assessment has already been carried out as part of a general impact assessment in the context of the adoption of that legal basis, paragraphs 1 to 7 shall not apply unless Member States deem it to be necessary to carry out such an assessment prior to processing activities.
11. Where necessary, the controller shall carry out a review to assess if processing is performed in accordance with the data protection impact assessment at least when there is a change of the risk represented by processing operations.'''
