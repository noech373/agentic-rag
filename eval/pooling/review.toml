[[chunks]]
question_id = "cnil-guide-main-recommendations"
chunk = "cnil-developer-guide-08#1"
question = "Which steps does the CNIL developer guide recommend to build software that complies with the GDPR?"
answer = "Six steps: be aware of the GDPR core principles (and identify a person responsible for compliance, or rely on the DPO); map and categorize the data and processing in your system, in a record of processing activities; prioritize the required actions according to the risks for data subjects; manage the risks, with a privacy impact assessment when the processing is likely to create high risks; put in place internal processes to ensure compliance at every development stage; document the compliance of your developments (CNIL GDPR Developer Guide, sheet 0)."
facts = [
