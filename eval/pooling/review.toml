[[chunks]]
question_id = "dora-incident-reporting-responsibility"
chunk = "dora#50"
question = "We run the ICT services of a bank and a major incident hits them. Who must report it to the regulator, and can we do it on the bank's behalf?"
answer = "The bank must: financial entities report major ICT-related incidents to their competent authority (Article 19(1)). It may outsource the reporting obligations to a third-party service provider, such as you, in accordance with Union and national sectoral law, but it then remains fully responsible for the fulfilment of the incident reporting requirements (Article 19(5))."
facts = [
  "Financial entities shall report major ICT-related incidents to the relevant competent authority | FEs shall report major ICT-related incidents to the relevant competent authority",
  "may outsource, in accordance with Union and national sectoral law, the reporting obligations under this Article to a third-party service provider",
  "the financial entity remains fully responsible for the fulfilment of the incident reporting requirements",
]
location = "DORA, Recital 51"
text = '''
(51) The propagators of cyber-attacks tend to pursue financial gains directly at the source, thus exposing financial entities to significant consequences. To prevent ICT systems from losing integrity or becoming unavailable, and hence to avoid data breaches and damage to physical ICT infrastructure, the reporting of major ICT-related incidents by financial entities should be significantly improved and streamlined. ICT-related incident reporting should be harmonised through the introduction of a requirement for all financial entities to report directly to their relevant competent authorities. Where a financial entity is subject to supervision by more than one national competent authority, Member States should designate a single competent authority as the addressee of such reporting. Credit institutions classified as significant in accordance with Article 6(4) of Council Regulation (EU) No 1024/2013 should submit such reporting to the national competent authorities, which should subsequently transmit the report to the European Central Bank (ECB).'''
verdict = "relevant"
fact = 1
quote = "ICT-related incident reporting should be harmonised through the introduction of a requirement for all financial entities to report directly to their relevant competent authorities."

