[[chunks]]
question_id = "ip-addresses-personal-data"
chunk = "cnil-developer-guide-01#1"
question = "Do I need to treat my visitors' IP addresses as private information?"
answer = "Yes: your visitors' IP addresses are personal data under the GDPR. An IP address is an online identifier which, combined with other information received by servers, can be used to create profiles of people and identify them (GDPR, recital 30), and personal data covers any information relating to a person identifiable by reference to an identifier such as an online identifier (Article 4(1)). The CNIL lists the IP address among examples of personal data where it relates to natural persons."
facts = [
  "online identifiers provided by their devices, applications, tools and protocols, such as internet protocol addresses | IP address, computer connection identifier or cookie identifier",
]
location = "CNIL GDPR Developer Guide, Definition"
text = '''
* The notion of **personal data** is defined in the General Data Protection Regulation (GDPR) as "any information relating to an identified or identifiable natural person (referred to as "data subject")". It covers a broad scope that includes both directly identifying data (e.g. first and last name) and indirectly identifying data (e.g. telephone number, license plate, terminal identifier, etc.).
* Any operation on this type of data (collection, recording, transmission, modification, dissemination, etc.) constitutes **processing within the meaning of the GDPR** and must therefore meet the requirements laid down by that regulation. Such processing operations must be lawful and have a specified purpose. The personal data collected and processed must be relevant and limited to what is strictly necessary to achieve the purpose.'''
