# Pooling review: does each chunk state one of the facts its question needs? Judge without
# looking at the LLM's verdicts (eval/pooling/llm.jsonl): the agreement is measured on this file.
#
# Set `verdict` to:
# - "relevant" if the chunk, read alone, states one of the `facts` (in any words; a recital
#   counts): set `fact` to its number in `facts` (1 for the first) and `quote` to the words of
#   the chunk that state it, copied exactly (4 to 25 words);
# - "new_fact" if it states something a good answer needs that no fact lists (the question
#   misses a fact): keep `fact = 0` and put its words in `quote`;
# - "rejected" otherwise (same topic only, a reference without the fact, or a mere extra).


[[chunks]]
question_id = "ai-act-high-risk-logs-retention"
chunk = "ai-act#208"
question = "We deploy a high-risk AI system under the AI Act. Do we have to keep the logs it generates, and for how long?"
answer = "Yes: high-risk AI systems must technically allow the automatic recording of events (logs) over their lifetime (AI Act, Article 12(1)), and deployers must keep the logs automatically generated, to the extent they are under their control, for a period appropriate to the intended purpose of at least six months, unless Union or national law (in particular on personal data) provides otherwise (Article 26(6))."
facts = [
  "Deployers of high-risk AI systems shall keep the logs automatically generated by that high-risk AI system",
  "under their control, for a period appropriate to the intended purpose of the high-risk AI system, of at least six months",
]
location = "AI Act, Article 12"
text = '''
1. High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system.
2. In order to ensure a level of traceability of the functioning of a high-risk AI system that is appropriate to the intended purpose of the system, logging capabilities shall enable the recording of events relevant for:
(a) identifying situations that may result in the high-risk AI system presenting a risk within the meaning of Article 79(1) or in a substantial modification;
(b) facilitating the post-market monitoring referred to in Article 72; and
(c) monitoring the operation of high-risk AI systems referred to in Article 26(5).
3. For high-risk AI systems referred to in point 1 (a), of Annex III, the logging capabilities shall provide, at a minimum:
(a) recording of the period of each use of the system (start date and time and end date and time of each use);
(b) the reference database against which input data has been checked by the system;
(c) the input data for which the search has led to a match;
(d) the identification of the natural persons involved in the verification of the results, as referred to in Article 14(5).'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-high-risk-testing-before-market"
chunk = "ai-act#165"
question = "Before placing a high-risk AI system on the market, what testing does the AI Act require?"
answer = "High-risk AI systems must be tested to identify the most appropriate risk management measures and to ensure they perform consistently for their intended purpose and comply with the requirements (AI Act, Article 9(6)). Testing is performed throughout development and in any event before placing on the market or putting into service, against prior defined metrics and probabilistic thresholds appropriate to the intended purpose (Article 9(8)). The provider's quality management system must also set out the examination, test and validation procedures to be carried out before, during and after development, and how often (Article 17(1)(d))."
facts = [
  "in any event, prior to their being placed on the market or put into service",
  "Testing shall be carried out against prior defined metrics and probabilistic thresholds",
  "examination, test and validation procedures to be carried out before, during and after the development of the high-risk AI system",
]
location = "AI Act, Recital 166"
text = '''
(166) It is important that AI systems related to products that are not high-risk in accordance with this Regulation and thus are not required to comply with the requirements set out for high-risk AI systems are nevertheless safe when placed on the market or put into service. To contribute to this objective, Regulation (EU) 2023/988 of the European Parliament and of the Council would apply as a safety net.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-instructions-for-deployers"
chunk = "ai-act#224"
question = "As the provider of a high-risk AI system, what information does the AI Act require us to give the companies that deploy it?"
answer = "Instructions for use, concise, complete, correct and clear (AI Act, Article 13(2)), containing at least: the provider's identity and contact details; the system's characteristics, capabilities and limitations of performance (intended purpose, level of accuracy, robustness and cybersecurity against which it was tested, foreseeable circumstances leading to risks, performance on specific groups, input data specifications, information to interpret the output); pre-determined changes; human oversight measures; the computational and hardware resources, expected lifetime and maintenance; and, where relevant, how to collect, store and interpret the logs (Article 13(3))."
facts = [
  "High-risk AI systems shall be accompanied by instructions for use in an appropriate digital format or otherwise | High-risk AI systems should be accompanied by appropriate information in the form of instructions of use",
  "the characteristics, capabilities and limitations of performance of the high-risk AI system | Such information should include the characteristics, capabilities and limitations of performance of the AI system",
  "the human oversight measures referred to in Article 14, including the technical measures | the relevant human oversight measures, including the measures to facilitate the interpretation of the outputs",
]
location = "AI Act, Article 24"
text = '''
1. Before making a high-risk AI system available on the market, distributors shall verify that it bears the required CE marking, that it is accompanied by a copy of the EU declaration of conformity referred to in Article 47 and instructions for use, and that the provider and the importer of that system, as applicable, have complied with their respective obligations as laid down in Article 16, points (b) and (c) and Article 23(3).
2. Where a distributor considers or has reason to consider, on the basis of the information in its possession, that a high-risk AI system is not in conformity with the requirements set out in Section 2, it shall not make the high-risk AI system available on the market until the system has been brought into conformity with those requirements. Furthermore, where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor shall inform the provider or the importer of the system, as applicable, to that effect.
3. Distributors shall ensure that, while a high-risk AI system is under their responsibility, storage or transport conditions, where applicable, do not jeopardise the compliance of the system with the requirements set out in Section 2.
4. A distributor that considers or has reason to consider, on the basis of the information in its possession, a high-risk AI system which it has made available on the market not to be in conformity with the requirements set out in Section 2, shall take the corrective actions necessary to bring that system into conformity with those requirements, to withdraw it or recall it, or shall ensure that the provider, the importer or any relevant operator, as appropriate, takes those corrective actions. Where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor shall immediately inform the provider or importer of the system and the authorities competent for the high-risk AI system concerned, giving details, in particular, of the non-compliance and of any corrective actions taken.
5. Upon a reasoned request from a relevant competent authority, distributors of a high-risk AI system shall provide that authority with all the information and documentation regarding their actions pursuant to paragraphs 1 to 4 necessary to demonstrate the conformity of that system with the requirements set out in Section 2.
6. Distributors shall cooperate with the relevant competent authorities in any action those authorities take in relation to a high-risk AI system made available on the market by the distributors, in particular to reduce or mitigate the risk posed by it.'''
verdict = "rejected"
fact = 0
quote = ""

