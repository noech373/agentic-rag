[[chunks]]
question_id = "exfiltration-online-service-notification"
chunk = "cnil-developer-guide-12#4"
question = "Hackers broke into our web app and copied our customers' personal data. All our customers live in one EU country. Do we have to alert the regulator and the people affected?"
answer = "Yes for the supervisory authority: a breach must be notified unless it is unlikely to result in a risk to individuals, and an exfiltration of customer data will usually create such a risk. The affected customers must also be informed if the breach is likely to result in a high risk to them, which depends on the nature of the data exposed and how severe the consequences could be (EDPB Guidelines 9/2022, example ii; GDPR, Articles 33(1) and 34(1))."
facts = [
  "Yes, report to the supervisory authority if there are likely consequences to individuals | unless the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons",
  "if the severity of the likely consequences to individuals is high | high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject",
]
location = "CNIL GDPR Developer Guide, What communication should be made when data security is compromised?"
text = '''
* **An organization may mistakenly or negligently suffer, accidentally or maliciously, a personal data breach, i.e. the destruction, loss, alteration or unauthorized disclosure of data**. In this case, the organization must report the violation to the local data protection agency within **72 hours** if it is likely to pose a risk to the rights and freedoms of individuals.
* If these risks are high, the organization must also inform the persons concerned as soon as possible and provide them with advice on how to protect their data (e.g. cancellation of a compromised bank card, modification of a password, modification of privacy settings, etc.).
* Notification of the violation to the CNIL must be made via the CNIL website.'''
verdict = "relevant"
fact = [1, 2]
quote = ["the organization must report the violation to the local data protection agency within **72 hours** if it is likely to pose a risk", "If these risks are high, the organization must also inform the persons concerned as soon as possible"]

