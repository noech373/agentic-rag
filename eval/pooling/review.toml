[[chunks]]
question_id = "data-act-cloud-pre-contract-switching-info"
chunk = "data-act#91"
question = "We sell a cloud platform to banks. Under the Data Act, what must we tell a bank about switching to another provider before it signs?"
answer = "You must make the written contract, which sets out the switching rights and obligations, available before signing, in a way that lets the bank store and reproduce it (Data Act, Article 25(1)); it must include at least a notice period of no more than two months, a transitional period of no more than 30 calendar days, the categories of data and digital assets that can be ported, a data retrieval period of at least 30 days and the applicable switching charges (Article 25(2)). Before entering into the contract, you must also give clear information on the standard service fees, the early termination penalties and the reduced switching charges that may apply until 12 January 2027 (Article 29(4)), and, where relevant, on services whose switching is highly complex or costly (Article 29(5)). You must inform the customer of the available switching and porting procedures, methods and formats, with their known restrictions and technical limitations, and refer it to an up-to-date online register of the data structures, formats and standards in which its exportable data are available (Article 26). Your contracts must also list the website where you publish the jurisdiction of your ICT infrastructure and your measures against unlawful foreign governmental access (Article 28). If your service is custom-built for an individual customer, you must tell the bank before signing which switching obligations do not apply (Article 31(3))."
facts = [
  "The provider of data processing services shall make that contract available to the customer prior to signing the contract",
  "clear information on the standard service fees and early termination penalties that might be imposed",
  "information on available procedures for switching and porting to the data processing service | That information should include procedures for initiating switching from the data processing service",
]
location = "Data Act, Recital 92"
text = '''
(92) Providers of data processing services should be required to offer all the assistance and support within their capacity, proportionate to their respective obligations, that is required to make the switching process to a service of a different provider of data processing services successful, effective and secure. This Regulation does not require providers of data processing services to develop new categories of data processing services, including within, or on the basis of, the ICT infrastructure of different providers of data processing services in order to guarantee functional equivalence in an environment other than their own systems. A source provider of data processing services does not have access to or insights into the environment of the destination provider of data processing services. Functional equivalence should not be understood to oblige the source provider of data processing services to rebuild the service in question within the infrastructure of the destination provider of data processing services. Instead, the source provider of data processing services should take all reasonable measures within its power to facilitate the process of achieving functional equivalence through the provision of capabilities, adequate information, documentation, technical support and, where appropriate, the necessary tools.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "demo-with-other-client-data"
chunk = "cnil-developer-guide-01#4"
question = "Can I show a prospect a demo built with real data from another client?"
answer = "No. As a processor, you may process the client's personal data only on its documented instructions (GDPR Article 28(3)(a)); a processor that determines the purposes and means of a processing itself is considered a controller for it and infringes the GDPR (Article 28(10)). The CNIL also warns that using real production data outside production diverts it from its original purpose and increases security risks: build a dummy data set that looks like the real data instead (CNIL developer guide, sheet 11)."
facts = [
  "Using personal data from your production database for testing purposes is tantamount to diverting it from its original purpose | collected for specified, explicit and legitimate purposes and not further processed in a manner that is incompatible with those purposes",
  "processes the personal data only on documented instructions from the controller",
  "if a processor infringes this Regulation by determining the purposes and means of processing, the processor shall be considered to be a controller",
  "So build a dummy data set that will look like the data that will be processed by your application",
]
location = "CNIL GDPR Developer Guide, Pseudonymization of personal data"
text = '''
* **Pseudonymization is a compromise between retaining raw data and producing anonymized datasets**.
* It refers to the processing of personal data in such a way that **data relating to a natural person can no longer be attributed without additional information**. The GDPR insists that this additional information must be kept separately and be subject to technical and organisational measures to avoid re-identification of data subjects. Unlike anonymisation, pseudonymization can be a reversible process.
* In practice, a pseudonymization process consists in **replacing directly identifying data (surname, first name, etc.) in a dataset with indirectly identifying data** (alias, number in a filing system, etc.) in order to reduce their sensitivity. They may result from a cryptographic hash of the data of individuals, such as their IP address, user ID, e-mail address.
* Data resulting from pseudonymization are considered as **personal data and therefore remain subject to the obligations of the GDPR**. However, the European Regulation encourages the use of pseudonymization in the processing of personal data. Moreover, the GDPR considers that pseudonymization makes it possible to reduce the risks for data subjects and to contribute to compliance with the Regulation.'''
verdict = "rejected"
fact = 0
quote = ""

