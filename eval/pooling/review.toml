question = "Can the DPO be an external provider, and can several companies of the same group share one DPO?"
answer = "Yes to both. The DPO may be a staff member or fulfil the tasks on the basis of a service contract (Article 37(6)). A group of undertakings may appoint a single DPO, provided that the DPO is easily accessible from each establishment (Article 37(2))."
facts = [
  "The data protection officer may be a staff member of the controller or processor, or fulfil the tasks on the basis of a service contract. | whether or not they are an employee of the controller",
  "A group of undertakings may appoint a single data protection officer provided that a data protection officer is easily accessible from each establishment.",
]
location = "ESAs JC 2024 33, (vi) Aggregated reporting, p. 13"
text = '''
39. Many respondents were of the view that it should be possible for ICT third-party providers or for financial groups to submit one aggregated/consolidated report for all affected FEs. They argue that disallowing such aggregated or consolidated reporting will pose reporting burden since:
➢ ICT service providers would have to report the same incident multiple times or would have to answer many questions of FEs within the first hours such that they can fill out reports;
➢ FEs would need to collect all information about the incident from TPPs, including intragroup providers;
➢ Financial groups would need to report the same incident multiple times;
➢ CAs that have to analyse multiple reports of the same incident and face difficulties in aggregating the impact of the incident.
40. Some of these respondents were of the view that the information about the incident should also be reported in an aggregated way without including individual information for each FE. The respondents also proposed that TPPs and financial groups should be allowed to submit one consolidated report including a list of all affected FEs to reduce the burden and to make incident reporting more efficient.
41. The ESAs would like to highlight that the CP already envisaged the possibility that there may be cases where several FEs outsource the incident reporting activities to a third-party service provider, including members within a financial group, in accordance with Article 19(5) of DORA and that in these cases, subject to an agreement between the FEs and their CA, it may be possible for said third-party service providers to provide one report at national level for the FEs supervised by the same CA containing the relevant individual information for each FE that would classify the incident as major.
42. Having assessed the feedback from the respondents and the arguments presented, the ESAs have decided to introduce explicitly the possibility for submission by an ICT TPPs or intragroup TPPs of a single aggregate report for multiple FEs affected by the same incident. The main rationale for introducing such aggregated reporting is that it provides a holistic overview of the impact of the incident and whether it is of systemic relevance, and to decrease the reporting effort by FEs and CAs. The ESAs also took into account that most of the information about the incident is likely to be available to the TPP if the incident originates from it.
43. However, the ESAs have introduced the following conditions to ensure that such aggregated reporting is aligned with the requirements of DORA:
➢ The incident originates or is being caused by a TPP;'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "dpo-it-manager-conflict"
chunk = "cnil-developer-guide-04#2"
question = "Can our IT manager also be the person responsible for checking that we comply with data protection rules?"
answer = "Only if it does not create a conflict of interests. The data protection officer may fulfil other tasks and duties, but the controller or processor must ensure they do not result in a conflict of interests (Article 38(6)). The GDPR does not say which roles conflict: whether the IT manager's role does is for the organisation to assess."
facts = [
  "The data protection officer may fulfil other tasks and duties.",
  "The controller or processor shall ensure that any such tasks and duties do not result in a conflict of interests.",
]
location = "CNIL GDPR Developer Guide, Be aware of your source code content."
text = '''
* Implement **code quality metrics tools** that will scan your code as soon as it is _committed_ to check its good quality. You can also add scripts to check these metrics in the version control system configuration: the _commit_ will be cancelled if the source code is not of sufficient quality.
* Keep your secrets and passwords out of your source code repository:
    * in separate **files, which have not been _committed_**. Remember to use special files from your version control system (such as _.gitignore_ for _Git_) so that you don't _commit_ sensitive files by mistake.
    * in **environment variables**, take care to check that environment variables are not accidentally written to *logs* or displayed when an application error occurs.
    * using **specific secret or configuration management software**.
  Finally, if you need to include such data in your repository, consider **automatically encrypting/decrypting** the files using a *plugin* from your version control system (e.g. _git-crypt_).
* After a _commit_ that contains personal or other critical data, don't forget to purge completely the source code repository: even after modification, the data may still be available in your repository history.
* Be careful before **publishing your source code online**. Review **its entire contents** to make sure that no personal data, passwords or other secrets are present, including the entire change history.'''
verdict = "rejected"
fact = 0
quote = ""

