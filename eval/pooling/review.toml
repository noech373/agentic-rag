[[chunks]]
question_id = "employee-leaving-assets"
chunk = "edpb-guidelines-2021-01#46"
question = "We are a managed service provider covered by NIS2. When an employee leaves, what do we have to do with the laptop and accounts they had?"
answer = "Assets in the employee's custody, such as their laptop, must be deposited, returned or deleted upon termination of employment, and the deposit, return or deletion must be documented. Where that is not possible, you must ensure the assets can no longer access your network and information systems (Implementing Regulation (EU) 2024/2690, Annex, point 12.5, reproduced in the ENISA guidance). Their access rights must also be modified accordingly upon termination of employment (point 11.2.2(b))."
facts = [
  "deposited, returned or deleted upon termination of employment and shall document the deposit, return and deletion of those assets",
  "ensure that access rights are modified accordingly upon termination or change of employment",
]
location = "EDPB Guidelines 01/2021, 4.3 Organizational and technical measures for preventing / mitigating the impacts of internal human risk sources, p. 22"
text = '''
83. A combination of the below mentioned measures - applied depending on the unique features of the case - should help to lower the chance of a similar breach reoccurring.
84. Advisable measures:
(The list of the following measures is by no means exclusive or comprehensive. Rather, the goal is to provide prevention ideas and possible solutions. Every processing activity is different, hence the controller shouldmake the decision on which measures fit the given situation the most.)
· Periodic implementation of training, education and awareness programs for employees on their privacy and security obligations and the detection and reporting of threats to the security of personal data 26 . Develop an awareness program to remind employees of the most commons errors leading to personal data breaches and how to avoid them.
· Establishment of robust and effective data protection and privacy practices, procedures and systems 27 .
· Evaluation of privacy practices, procedures and systems to ensure continued effectiveness 28 .
· Making proper access control policies and forcing users to follow the rules.
· Implementing techniques to force user authentication when accessing sensitive personal data.
· Disabling the company related account of the user as soon as the person leaves the company.
· Checking unusual dataflow between the file server and employee workstations.
· Setting up I/O interface security in the BIOS or through the use of software controlling the use of computer interfaces (lock or unlock e. g. USB/CD/DVD etc.).
· Reviewing employees' access policy (e.g. logging access to sensitive data and requiring the user to input a business reason, so that this is available for audits).
· Disabling open cloud services.
· Forbidding and preventing access to known open mail services.
· Disabling print screen function in OS.
· Enforcing a clean desk policy.
· Automated locking all computers after a certain amount of time of inactivity.
· Use mechanisms (e.g. (wireless) token to log on/open locked accounts) for fast user switches in shared environments.
· Use of dedicated systems for managing personal data that apply appropriate access control mechanisms and that prevent human mistake, such as sending of communications to the wrong subject. The use of spreadsheets and other office documents is not an appropriate means to manage client data.'''
verdict = "rejected"
fact = 0
