# Pooling review: does each chunk state one of the facts its question needs? Judge without
# looking at the LLM's verdicts (eval/pooling/llm.jsonl): the agreement is measured on this file.
#
# Set `verdict` to:
# - "relevant" if the chunk, read alone, states one of the `facts` (in any words; a recital
#   counts): set `fact` to its number in `facts` (1 for the first) and `quote` to the words of
#   the chunk that state it, copied exactly (4 to 25 words); if it states several facts, give
#   lists in the same order: `fact = [1, 3]` and `quote = ["…", "…"]`;
# - "new_fact" if it states something a good answer needs that no fact lists (the question
#   misses a fact): keep `fact = 0` and put its words in `quote`;
# - "rejected" otherwise (same topic only, a reference without the fact, or a mere extra).


[[chunks]]
question_id = "ai-act-high-risk-logs-retention"
chunk = "ai-act#202"
question = "We deploy a high-risk AI system under the AI Act. Do we have to keep the logs it generates, and for how long?"
answer = "Yes: high-risk AI systems must technically allow the automatic recording of events (logs) over their lifetime (AI Act, Article 12(1)), and deployers must keep the logs automatically generated, to the extent they are under their control, for a period appropriate to the intended purpose of at least six months, unless Union or national law (in particular on personal data) provides otherwise (Article 26(6))."
facts = [
  "Deployers of high-risk AI systems shall keep the logs automatically generated by that high-risk AI system",
  "under their control, for a period appropriate to the intended purpose of the high-risk AI system, of at least six months",
]
location = "AI Act, Article 8"
text = '''
1. High-risk AI systems shall comply with the requirements laid down in this Section, taking into account their intended purpose as well as the generally acknowledged state of the art on AI and AI-related technologies. The risk management system referred to in Article 9 shall be taken into account when ensuring compliance with those requirements.
2. Where a product contains an AI system, to which the requirements of this Regulation as well as requirements of the Union harmonisation legislation listed in Section A of Annex I apply, providers shall be responsible for ensuring that their product is fully compliant with all applicable requirements under applicable Union harmonisation legislation. In ensuring the compliance of high-risk AI systems referred to in paragraph 1 with the requirements set out in this Section, and in order to ensure consistency, avoid duplication and minimise additional burdens, providers shall have a choice of integrating, as appropriate, the necessary testing and reporting processes, information and documentation they provide with regard to their product into documentation and procedures that already exist and are required under the Union harmonisation legislation listed in Section A of Annex I.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-high-risk-testing-before-market"
chunk = "ai-act#253"
question = "Before placing a high-risk AI system on the market, what testing does the AI Act require?"
answer = "High-risk AI systems must be tested to identify the most appropriate risk management measures and to ensure they perform consistently for their intended purpose and comply with the requirements (AI Act, Article 9(6)). Testing is performed throughout development and in any event before placing on the market or putting into service, against prior defined metrics and probabilistic thresholds appropriate to the intended purpose (Article 9(8)). The provider's quality management system must also set out the examination, test and validation procedures to be carried out before, during and after development, and how often (Article 17(1)(d))."
facts = [
  "in any event, prior to their being placed on the market or put into service",
  "Testing shall be carried out against prior defined metrics and probabilistic thresholds",
  "examination, test and validation procedures to be carried out before, during and after the development of the high-risk AI system",
]
location = "AI Act, Article 43"
text = '''
3. For high-risk AI systems covered by the Union harmonisation legislation listed in Section A of Annex I, the provider shall follow the relevant conformity assessment procedure as required under those legal acts. The requirements set out in Section 2 of this Chapter shall apply to those high-risk AI systems and shall be part of that assessment. Points 4.3., 4.4., 4.5. and the fifth paragraph of point 4.6 of Annex VII shall also apply.
For the purposes of that assessment, notified bodies which have been notified under those legal acts shall be entitled to control the conformity of the high-risk AI systems with the requirements set out in Section 2, provided that the compliance of those notified bodies with requirements laid down in Article 31(4), (5), (10) and (11) has been assessed in the context of the notification procedure under those legal acts.
Where a legal act listed in Section A of Annex I enables the product manufacturer to opt out from a third-party conformity assessment, provided that that manufacturer has applied all harmonised standards covering all the relevant requirements, that manufacturer may use that option only if it has also applied harmonised standards or, where applicable, common specifications referred to in Article 41, covering all requirements set out in Section 2 of this Chapter.
4. High-risk AI systems that have already been subject to a conformity assessment procedure shall undergo a new conformity assessment procedure in the event of a substantial modification, regardless of whether the modified system is intended to be further distributed or continues to be used by the current deployer.
For high-risk AI systems that continue to learn after being placed on the market or put into service, changes to the high-risk AI system and its performance that have been pre-determined by the provider at the moment of the initial conformity assessment and are part of the information contained in the technical documentation referred to in point 2(f) of Annex IV, shall not constitute a substantial modification.
5. The Commission is empowered to adopt delegated acts in accordance with Article 97 in order to amend Annexes VI and VII by updating them in light of technical progress.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-job-application-sorting-not-high-risk"
chunk = "ai-act#363"
question = "Our tool only sorts incoming job applications into folders by language, without ranking anyone. Is it still high-risk under the AI Act?"
answer = "Probably not. AI systems used to analyse and filter job applications are listed in Annex III (point 4(a)), but an Annex III system is not high-risk when it does not pose a significant risk of harm, in particular when it is intended to perform a narrow procedural task (AI Act, Article 6(3)(a)), unless it performs profiling of natural persons, in which case it is always high-risk. The provider who considers it not high-risk must document that assessment before placing it on the market and register it (Article 6(4))."
facts = [
  "in particular to place targeted job advertisements, to analyse and filter job applications, and to evaluate candidates",
  "the AI system is intended to perform a narrow procedural task | an AI system that classifies incoming documents into categories",
  "shall always be considered to be high-risk where the AI system performs profiling of natural persons",
  "A provider who considers that an AI system referred to in Annex III is not high-risk shall document its assessment",
]
location = "AI Act, Annex III"
text = '''
7. Migration, asylum and border control management, in so far as their use is permitted under relevant Union or national law:
  (a) AI systems intended to be used by or on behalf of competent public authorities or by Union institutions, bodies, offices or agencies as polygraphs or similar tools;
  (b) AI systems intended to be used by or on behalf of competent public authorities or by Union institutions, bodies, offices or agencies to assess a risk, including a security risk, a risk of irregular migration, or a health risk, posed by a natural person who intends to enter or who has entered into the territory of a Member State;
  (c) AI systems intended to be used by or on behalf of competent public authorities or by Union institutions, bodies, offices or agencies to assist competent public authorities for the examination of applications for asylum, visa or residence permits and for associated complaints with regard to the eligibility of the natural persons applying for a status, including related assessments of the reliability of evidence;
  (d) AI systems intended to be used by or on behalf of competent public authorities, or by Union institutions, bodies, offices or agencies, in the context of migration, asylum or border control management, for the purpose of detecting, recognising or identifying natural persons, with the exception of the verification of travel documents.
8. Administration of justice and democratic processes:
  (a) AI systems intended to be used by a judicial authority or on their behalf to assist a judicial authority in researching and interpreting facts and the law and in applying the law to a concrete set of facts, or to be used in a similar way in alternative dispute resolution;
  (b) AI systems intended to be used for influencing the outcome of an election or referendum or the voting behaviour of natural persons in the exercise of their vote in elections or referenda. This does not include AI systems to the output of which natural persons are not directly exposed, such as tools used to organise, optimise or structure political campaigns from an administrative or logistical point of view.'''
verdict = "rejected"
fact = 0
