[[chunks]]
question_id = "ai-act-recruitment-no-external-assessment"
chunk = "ai-act#56"
question = "Our AI system for screening job candidates is high-risk. Under the AI Act, do we need an external body to assess it before launch?"
answer = "No: for the high-risk systems in points 2 to 8 of Annex III, which include recruitment and selection (point 4), the provider follows the conformity assessment procedure based on internal control of Annex VI, without the involvement of a notified body (AI Act, Article 43(2))."
facts = [
  "intended to be used for the recruitment or selection of natural persons, in particular to place targeted job advertisements",
  "conformity assessment procedure based on internal control as referred to in Annex VI, which does not provide for the involvement of a notified body | the conformity assessment of such systems should be carried out as a general rule by the provider under its own responsibility",
]
location = "AI Act, Recital 57"
text = '''
(57) AI systems used in employment, workers management and access to self-employment, in particular for the recruitment and selection of persons, for making decisions affecting terms of the work-related relationship, promotion and termination of work-related contractual relationships, for allocating tasks on the basis of individual behaviour, personal traits or characteristics and for monitoring or evaluation of persons in work-related contractual relationships, should also be classified as high-risk, since those systems may have an appreciable impact on future career prospects, livelihoods of those persons and workers’ rights. Relevant work-related contractual relationships should, in a meaningful manner, involve employees and persons providing services through platforms as referred to in the Commission Work Programme 2021. Throughout the recruitment process and in the evaluation, promotion, or retention of persons in work-related contractual relationships, such systems may perpetuate historical patterns of discrimination, for example against women, certain age groups, persons with disabilities, or persons of certain racial or ethnic origins or sexual orientation. AI systems used to monitor the performance and behaviour of such persons may also undermine their fundamental rights to data protection and privacy.'''
verdict = "relevant"
fact = 1
quote = "AI systems used in employment, workers management and access to self-employment, in particular for the recruitment and selection of persons"

[[chunks]]
question_id = "ai-act-third-party-gpai-model"
chunk = "ai-act#116"
question = "We build an assistant on top of a third-party general-purpose AI model. Under the AI Act, what must the model provider give us, and are we a provider ourselves?"
answer = "The provider of the general-purpose AI model must draw up, keep up to date and make available information and documentation to the providers who integrate the model into their AI systems, so that they understand its capabilities and limitations and can comply with their own obligations (AI Act, Article 53(1)(b), detailed in Annex XII). By integrating the model into your assistant you are a 'downstream provider': the provider of your own AI system, whoever supplies the model (Article 3(68)), and you bear the obligations attached to that system."
facts = [
  "make available information and documentation to providers of AI systems who intend to integrate the general-purpose AI model into their AI systems | the technical means (e.g. instructions for use, infrastructure, tools) required for the general-purpose AI model to be integrated into AI systems",
  "good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations | downstream providers that necessitate a good understanding of the models and their capabilities",
  "means a provider of an AI system, including a general-purpose AI system, which integrates an AI model",
]
location = "AI Act, Recital 117"
text = '''
(117) The codes of practice should represent a central tool for the proper compliance with the obligations provided for under this Regulation for providers of general-purpose AI models. Providers should be able to rely on codes of practice to demonstrate compliance with the obligations. By means of implementing acts, the Commission may decide to approve a code of practice and give it a general validity within the Union, or, alternatively, to provide common rules for the implementation of the relevant obligations, if, by the time this Regulation becomes applicable, a code of practice cannot be finalised or is not deemed adequate by the AI Office. Once a harmonised standard is published and assessed as suitable to cover the relevant obligations by the AI Office, compliance with a European harmonised standard should grant providers the presumption of conformity. Providers of general-purpose AI models should furthermore be able to demonstrate compliance using alternative adequate means, if codes of practice or harmonised standards are not available, or they choose not to rely on those.'''
verdict = "rejected"
fact = 0
quote = ""

