[[chunks]]
question_id = "cookie-shopping-basket-consent"
chunk = "data-act#37"
question = "Is consent required for a cookie that is only used to remember the shopping basket?"
answer = "In general, no: the ePrivacy consent requirement does not apply to trackers that are strictly necessary to provide a service requested by the user, which a basket-only cookie is (CNIL, sheet 15)."
facts = [
  "strictly necessary to provide a service requested by the user",
]
location = "Data Act, Recital 38"
text = '''
(38) In line with the data minimisation principle, third parties should access only information that is necessary for the provision of the service requested by the user. Having received access to data, the third party should process it for the purposes agreed with the user without interference from the data holder. It should be as easy for the user to refuse or discontinue access by the third party to the data as it is for the user to authorise access. Neither third parties nor data holders should make the exercise of choices or rights by the user unduly difficult, including by offering choices to the user in a non-neutral manner, or by coercing, deceiving or manipulating the user, or by subverting or impairing the autonomy, decision-making or choices of the user, including by means of a user digital interface or a part thereof. In that context, third parties or data holders should not rely on so-called ‘dark patterns’ in designing their digital interfaces. Dark patterns are design techniques that push or deceive consumers into decisions that have negative consequences for them. Those manipulative techniques can be used to persuade users, in particular vulnerable consumers, to engage in unwanted behaviour, to deceive users by nudging them into decisions on data disclosure transactions or to unreasonably bias the decision-making of the users of the service in such a way as to subvert or impair their autonomy, decision-making and choice. Common and legitimate commercial practices that comply with Union law should not in themselves be regarded as constituting dark patterns. Third parties and data holders should comply with their obligations under relevant Union law, in particular the requirements laid down in Directives 98/6/EC and 2000/31/EC of the European Parliament and of the Council and in Directives 2005/29/EC and 2011/83/EU.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "data-act-application-dates"
chunk = "data-act#34"
question = "We are a bank. From when does the EU regulation on fair access to and use of data apply, and from when can our cloud provider no longer charge us for switching?"
answer = "The Data Act applies from 12 September 2025, with staggered dates for some provisions: the design obligation of Article 3(1) applies to connected products placed on the market after 12 September 2026, and the rules on unfair terms apply from 12 September 2027 to some contracts concluded before 12 September 2025 (Article 50). Until 12 January 2027, cloud providers may only impose reduced switching charges, which cannot exceed the costs directly linked to the switching process; from 12 January 2027 they may not impose any switching charges at all (Article 29(1) to (3)). This does not cover standard service fees or early termination penalties, which are not switching charges (Article 2(36)), nor data egress charges at cost for in-parallel use of several providers (Article 34(2))."
