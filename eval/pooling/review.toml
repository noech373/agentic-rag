[[chunks]]
question_id = "data-act-atm-derived-data"
chunk = "cnil-developer-guide-01#2"
question = "Our ATMs send us raw sensor readings and error logs, and we compute failure predictions from them with our own algorithms. Under the EU rules on access to connected-device data, which of these must we hand over to the bank that uses the machines?"
answer = "The raw and pre-processed data: readings generated automatically by sensors and data recorded by embedded applications, including those indicating hardware status and malfunctions, are product data the bank must be able to access, with the metadata needed to interpret them (Data Act, Article 2(15), Article 4(1), recital 15). Your failure predictions are in principle not covered: information inferred or derived from the data as the outcome of additional investments, in particular by means of proprietary, complex algorithms, falls outside the scope of the Regulation, unless otherwise agreed with the user (recital 15). This exclusion is stated in a recital, not an article, and only holds if the predictions do result from such investments; processing that merely makes raw data understandable and usable remains in scope."
facts = [
  "data generated automatically by sensors and data recorded by embedded applications, including applications indicating hardware status and malfunctions",
  "information inferred or derived from such data, which is the outcome of additional investments into assigning values or insights from the data",
]
location = "CNIL GDPR Developer Guide, Examples of personal data"
text = '''
* Where they relate to natural persons, **the following data are personal data**:
    * Surname, first name, pseudonym, date of birth;
    * photos, sound recordings of voices;
    * fixed or mobile telephone number, postal address, email address;
    * IP address, computer connection identifier or cookie identifier;
    * Fingerprint, palm or venous network of the hand, retinal print;
    * License plate number, social security number, ID number;
    * Application usage data, comments, etc...
* **Identification of natural persons can be carried out**:
    * from a single piece of data (examples: surname and first name);
    * from crossing of a set of data (example: a woman living at such and such an address, born on such and such a day and member of such and such an association).
* Some data are considered **particularly sensitive**. The GDPR prohibits the collection or use of such data, unless, in particular, all involved data subjects have given their express consent (active, explicit and preferably written consent, which must be free, specific and informed).
* These requirements concern the following data:
    * data relating to the **health of individuals**;
    * data concerning **sexual life** or **sexual orientation**;
    * data revealing an alleged **racial** or **ethnic** origin;
    * political opinions, religious beliefs, philosophical beliefs or trade union membership;
    * **genetic** and **biometric data used for the purpose of uniquely identifying an individual**.'''
