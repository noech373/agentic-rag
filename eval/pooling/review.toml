  "assess if supervisory conditions for contracting are met | the necessary supervisory approvals or other conditions",
  "identify and assess all relevant risks in relation to the contractual arrangement | the possible concentration risk entailed",
  "undertake all due diligence on prospective ICT third-party service providers | applying due diligence in the process of selection and assessment of ICT third-party service providers",
  "identify and assess conflicts of interest that the contractual arrangement may cause | assessing potential conflicts of interest",
