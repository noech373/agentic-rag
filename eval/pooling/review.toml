[[chunks]]
question_id = "breach-no-notification-individuals"
chunk = "edpb-guidelines-2021-01#3"
question = "Are there situations where I don't need to inform the individuals concerned by a breach?"
answer = "Yes. First, communication to data subjects is only required when the breach is likely to result in a high risk to their rights and freedoms (GDPR Art. 34(1)); otherwise only the supervisory authority may need to be notified. Even with a high risk, it is not required if (a) appropriate protection measures such as encryption rendered the data unintelligible, (b) subsequent measures ensure the high risk is no longer likely to materialise, or (c) it would involve disproportionate effort, in which case a public communication is made instead (Art. 34(3)). The controller must be able to demonstrate this, and the supervisory authority can still require communication (Art. 34(4))."
facts = [
  "those that render the personal data unintelligible to any person who is not authorised to access it, such as encryption | Article 34(3) GDPR states three conditions that, if met, do not require notification to individuals | the data are in principle unintelligible. Thus, the breach is unlikely to adversely affect individuals and therefore would not require communication to those individuals | if personal data have been made essentially unintelligible to unauthorised parties and where the data are a copy or a backup exists",
  "high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject | Communication of a breach to the individual is only triggered where it is likely to result in a high risk | the given breach will not result in a high risk to the rights and freedoms of natural persons, a notification to the SA will suffice",
]
location = "EDPB Guidelines 01/2021, 1 INTRODUCTION, p. 5"
text = '''
6. A breach can potentially have a range of significant adverse effects on individuals, which can result in physical, material, or non-material damage. The GDPR explains that this can include loss of control over their personal data, limitation of their rights, discrimination, identity theft or fraud, financial loss, unauthorised reversal of pseudonymisation, damage to reputation, and loss of confidentiality of personal data protected by professional secrecy. It can also include any other significant economic or social disadvantage to those individuals. One of the most important obligation of the data controller is to evaluate these risks to the rights and freedoms of data subjects and to implement appropriate technical and organizational measures to address them.
7. Accordingly, the GDPR requires the controller to:
· document any personal data breaches, comprising the facts relating to the personal data breach, its effects and the remedial action taken 6 ;
· notify the personal data breach to the supervisory authority, unless the data breach is unlikely to result in a risk to the rights and freedoms of natural persons 7 ;
· communicate the personal data breach to the data subject when the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons 8 .
8. Data breaches are problems in and of themselves, but they may be also symptoms of a vulnerable, possibly outdated data security regime, they may also indicate system weaknesses to be addressed. As a general truth, it is always better to prevent data breaches by preparing in advance, since several consequences of them are by nature irreversible. Before a controller can fully assess the risk arising from a breach caused by some form of attack, the root cause of the issue should be identified, in order to identify whether any vulnerabilities that gave rise to the incident are still present, and are still therefore exploitable. In many cases the controller is able to identify that the incident is likely to result in a risk, and is therefore to be
notified. In other cases the notification does not need to be postponed until the risk and impact surrounding the breach has been fully assessed, since the full risk assessment can happen in parallel to notification, and the information thus gained may be provided to the SA in phases without undue further delay 9 .'''
verdict = "relevant"
fact = 2
quote = "communicate the personal data breach to the data subject when the personal data breach is likely to result in a high risk"

