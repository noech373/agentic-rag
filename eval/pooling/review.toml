[[chunks]]
question_id = "pseudonymise-before-indexing"
chunk = "gdpr#180"
question = "Do we need to pseudonymise personal data before indexing documents in the RAG pipeline?"
answer = "Not as a general obligation. The controller and the processor must implement technical and organisational measures that ensure a level of security appropriate to the risk (GDPR Article 32(1)); pseudonymisation is one of the measures listed, as appropriate, and also a way to implement data protection by design (Article 25(1)). The CNIL suggests it to reduce the sensitivity of data that is still useful, but pseudonymised data remain personal data, subject to the regulations (CNIL developer guide, sheets 1 and 7): the indexed chunks would still need erasure, access control and a retention period."
facts = [
  "the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk",
  "the pseudonymisation and encryption of personal data | such as pseudonymisation, which are designed to implement data-protection principles | you can reduce its sensitivity by using pseudomisation or even anonymisation methods | the GDPR considers that pseudonymization makes it possible to reduce the risks for data subjects | The application of pseudonymisation to personal data can reduce the risks to the data subjects concerned | can also reduce the likelihood of individuals being identified in the event of a breach",
  "in case of pseudonymization these data remain subject to the regulations on personal data | Data resulting from pseudonymization are considered as personal data and therefore remain subject to the obligations of the GDPR | Personal data which have undergone pseudonymisation, which could be attributed to a natural person by the use of additional information",
]
location = "GDPR, Article 5"
text = '''
1. Personal data shall be:
(a) processed lawfully, fairly and in a transparent manner in relation to the data subject (‘lawfulness, fairness and transparency’);
(b) collected for specified, explicit and legitimate purposes and not further processed in a manner that is incompatible with those purposes; further processing for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes shall, in accordance with Article 89(1), not be considered to be incompatible with the initial purposes (‘purpose limitation’);
(c) adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed (‘data minimisation’);
(d) accurate and, where necessary, kept up to date; every reasonable step must be taken to ensure that personal data that are inaccurate, having regard to the purposes for which they are processed, are erased or rectified without delay (‘accuracy’);
(e) kept in a form which permits identification of data subjects for no longer than is necessary for the purposes for which the personal data are processed; personal data may be stored for longer periods insofar as the personal data will be processed solely for archiving purposes in the public interest, scientific or historical research purposes or statistical purposes in accordance with Article 89(1) subject to implementation of the appropriate technical and organisational measures required by this Regulation in order to safeguard the rights and freedoms of the data subject (‘storage limitation’);
(f) processed in a manner that ensures appropriate security of the personal data, including protection against unauthorised or unlawful processing and against accidental loss, destruction or damage, using appropriate technical or organisational measures (‘integrity and confidentiality’).
2. The controller shall be responsible for, and be able to demonstrate compliance with, paragraph 1 (‘accountability’).'''
verdict = "relevant"
fact = 1
quote = "processed in a manner that ensures appropriate security of the personal data, including protection against unauthorised or unlawful processing"

