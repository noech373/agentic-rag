question_id = "dora-provider-audit-rights"
chunk = "dora#62"
question = "We sell ICT services to banks. Do we have to accept audit rights from a financial client?"
answer = "Yes, when your services support a critical or important function of the client: the contract must give the financial entity, or a third party it appoints, and the competent authority unrestricted rights of access, inspection and audit, and the right to take copies of relevant documentation (Article 30(3)(e)(i)). You may agree on alternative assurance levels if other clients' rights are affected (Article 30(3)(e)(ii)), and a client that is a microenterprise may agree that these rights are delegated to an independent third party appointed by you (Article 30(3), last subparagraph). The financial entity pre-determines the frequency of audits and the areas audited on a risk-based approach (Article 28(6))."
