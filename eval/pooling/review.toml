quote = "Communication of a breach to the individual is only triggered where it is likely to result in a high risk"

[[chunks]]
question_id = "bundled-consent-gym"
chunk = "gdpr#31"
question = "My gym says I can only sign up if I agree to them passing my data on to partner brands. Does my 'yes' really count?"
answer = "Probably not. Consent must be freely given (Article 4(11)). When assessing whether it is, utmost account is taken of whether the provision of a service is made conditional on consent to processing that is not necessary for it (Article 7(4)); consent is presumed not freely given in that case (recital 43). Sharing your data with partner brands is not necessary to provide a gym membership, and consent is not freely given if you have no genuine or free choice (recital 42)."
facts = [
  "any freely given, specific, informed and unambiguous indication of the data subject's wishes",
  "is conditional on consent to the processing of personal data that is not necessary for the performance of that contract | is dependent on the consent despite such consent not being necessary for such performance",
  "Consent should not be regarded as freely given if the data subject has no genuine or free choice",
]
location = "GDPR, Recital 32"
text = '''
(32) Consent should be given by a clear affirmative act establishing a freely given, specific, informed and unambiguous indication of the data subject's agreement to the processing of personal data relating to him or her, such as by a written statement, including by electronic means, or an oral statement. This could include ticking a box when visiting an internet website, choosing technical settings for information society services or another statement or conduct which clearly indicates in this context the data subject's acceptance of the proposed processing of his or her personal data. Silence, pre-ticked boxes or inactivity should not therefore constitute consent. Consent should cover all processing activities carried out for the same purpose or purposes. When the processing has multiple purposes, consent should be given for all of them. If the data subject's consent is to be given following a request by electronic means, the request must be clear, concise and not unnecessarily disruptive to the use of the service for which it is provided.'''
verdict = "relevant"
fact = 1
quote = "Consent should be given by a clear affirmative act establishing a freely given, specific, informed and unambiguous indication of the data subject's agreement"

