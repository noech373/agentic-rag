2. Without prejudice to Directive (EU) 2019/770, the contract referred to in paragraph 1 of this Article shall include at least the following:
(a) clauses allowing the customer, upon request, to switch to a data processing service offered by a different provider of data processing services or to port all exportable data and digital assets to an on-premises ICT infrastructure, without undue delay and in any event not after the mandatory maximum transitional period of 30 calendar days, to be initiated after the maximum notice period referred to in point (d), during which the service contract remains applicable and during which the provider of data processing services shall:
  (i) provide reasonable assistance to the customer and third parties authorised by the customer in the switching process;
  (ii) act with due care to maintain business continuity, and continue the provision of the functions or services under the contract;
  (iii) provide clear information concerning known risks to continuity in the provision of the functions or services on the part of the source provider of data processing services;
  (iv) ensure that a high level of security is maintained throughout the switching process, in particular the security of the data during their transfer and the continued security of the data during the retrieval period specified in point (g), in accordance with applicable Union or national law;
(b) an obligation of the provider of data processing services to support the customer’s exit strategy relevant to the contracted services, including by providing all relevant information;
(c) a clause specifying that the contract shall be considered to be terminated and the customer shall be notified of the termination, in one of the following cases:
  (i) where applicable, upon the successful completion of the switching process;
  (ii) at the end of the maximum notice period referred to in paragraph (d), where the customer does not wish to switch but to erase its exportable data and digital assets upon service termination;
(d) a maximum notice period for initiation of the switching process, which shall not exceed two months;'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "dora-pre-contract-assessment"
chunk = "dora#65"
question = "We are a bank about to sign with a new ICT provider. What does DORA require us to do before entering into the contract?"
answer = "Before entering into a contractual arrangement on the use of ICT services, financial entities must (Article 28(4)): (a) assess whether it covers ICT services supporting a critical or important function; (b) assess if supervisory conditions for contracting are met; (c) identify and assess all relevant risks, including ICT concentration risk; (d) undertake all due diligence on the prospective provider; (e) identify and assess conflicts of interest the arrangement may cause."
facts = [
  "assess whether the contractual arrangement covers the use of ICT services supporting a critical or important function",
  "assess if supervisory conditions for contracting are met",
  "identify and assess all relevant risks in relation to the contractual arrangement",
  "undertake all due diligence on prospective ICT third-party service providers",
  "identify and assess conflicts of interest that the contractual arrangement may cause",
]
location = "DORA, Recital 66"
text = '''
(66) A thorough pre-contracting analysis should underpin and precede the formal conclusion of contractual arrangements, in particular by focusing on elements such as the criticality or importance of the services supported by the envisaged ICT contract, the necessary supervisory approvals or other conditions, the possible concentration risk entailed, as well as applying due diligence in the process of selection and assessment of ICT third-party service providers and assessing potential conflicts of interest. For contractual arrangements concerning critical or important functions, financial entities should take into consideration the use by ICT third-party service providers of the most up-to-date and highest information security standards. Termination of contractual arrangements could be prompted at least by a series of circumstances showing shortfalls at the ICT third-party service provider level, in particular significant breaches of laws or contractual terms, circumstances revealing a potential alteration of the performance of the functions provided for in the contractual arrangements, evidence of weaknesses of the ICT third-party service provider in its overall ICT risk management, or circumstances indicating the inability of the relevant competent authority to effectively supervise the financial entity.'''
verdict = "relevant"
fact = [1, 2, 3, 4, 5]
quote = ["focusing on elements such as the criticality or importance of the services supported by the envisaged ICT contract", "the necessary supervisory approvals or other conditions", "the possible concentration risk entailed", "applying due diligence in the process of selection and assessment of ICT third-party service providers", "assessing potential conflicts of interest"]

