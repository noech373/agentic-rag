location = "ENISA NIS2 implementation guidance, Point 11.6.2, p. 142"
text = '''
11.6.2. For that purpose, the relevant entities shall:
(a) ensure the strength of authentication is appropriate to the classification of the asset to be accessed;
(b) control the allocation to users and management of secret authentication information by a process that ensures the confidentiality of the information, including advising personnel on appropriate handling of authentication information;
(c) require the change of authentication credentials initially, at predefined intervals and upon suspicion that the credentials were compromised;
(d) require the reset of authentication credentials and the blocking of users after a predefined number of unsuccessful log-in attempts;
(e) terminate inactive sessions after a predefined period of inactivity; and
(f) require separate credentials to access privileged access or administrative accounts.
June 2025, version 1.0
GUIDANCE
· Use unique authentication credentials for all the entity's assets. Best-practice implementation includes, as a minimum, an 8-character password for accounts using MFA and a 14-character password for accounts not using MFA.
· Consider that the allocation and management process for authentication information should ensure that:
o passwords or PINs generated automatically during enrolment processes as temporary secret authentication information are non-guessable and unique for each user; and that users are required to change them after the first use;
o procedures are established to verify the identity of a user prior to providing new, replacement or temporary authentication information;
o authentication information, including temporary authentication information, is transmitted to users in a secure manner (e.g. via an authenticated and protected channel), and the use of unprotected (clear text) electronic mail messages is avoided;
o users acknowledge receipt of authentication information;
o default authentication information as predefined or provided by suppliers is changed immediately following installation of systems or software;
o records of significant events concerning allocation and management of authentication information are kept and their confidentiality granted, and that the record keeping method is approved (e.g. using an approved password vault tool).
· When passwords are used as authentication information, the password management system should:
o allow users to select and change their own passwords and include a confirmation procedure to address input errors;
o enforce strong passwords ( 96 );
o force users to change their passwords at first login, if relevant;
o enforce password changes as necessary, for example after a security incident or upon termination or change of employment when a user has known passwords for identities that remain active (e.g. shared identities);
o prevent the use of commonly used passwords, and compromised combinations of usernames and password from hacked systems;'''
