[[chunks]]
question_id = "smart-thermostat-data-access"
chunk = "data-act#14"
question = "I bought a smart thermostat. Under the Data Act, can I get the data it collected from the manufacturer?"
answer = "Generally yes. If the thermostat or its app doesn't already give you direct access, the data holder (typically the manufacturer, via its app or cloud) must, on a simple electronic request, make the readily available data and the metadata needed to interpret it accessible to you without undue delay, easily, securely and free of charge (Data Act, Art. 4(1)). This does not apply if the thermostat comes from a micro or small enterprise without a larger partner or linked company, with a one-year grace period for medium-sized enterprises (Art. 7(1))."
facts = [
  "shall make readily available data, as well as the relevant metadata necessary to interpret and use those data, accessible to the user",
]
location = "Data Act, Recital 15"
text = '''
(15) The data represent the digitisation of user actions and events and should accordingly be accessible to the user. The rules for access to and the use of data from connected products and related services under this Regulation address both product data and related service data. Product data refers to data generated by the use of a connected product that the manufacturer designed to be retrievable from the connected product by a user, data holder or a third party, including, where relevant, the manufacturer. Related service data refers to data, which also represent the digitisation of user actions or events related to the connected product which are generated during the provision of a related service by the provider. Data generated by the use of a connected product or related service should be understood to cover data recorded intentionally or data which result indirectly from the user’s action, such as data about the connected product’s environment or interactions. This should include data on the use of a connected product generated by a user interface or via a related service, and should not be limited to the information that such use took place, but should include all data that the connected product generates as a result of such use, such as data generated automatically by sensors and data recorded by embedded applications, including applications indicating hardware status and malfunctions. This should also include data generated by the connected product or related service during times of inaction by the user, such as when the user chooses not to use a connected product for a given period of time and instead to keep it in stand-by mode or even switched off, as the status of a connected product or its components, for example its batteries, can vary when the connected product is in stand-by mode or switched off. Data which are not substantially modified, meaning data in raw form, also known as source or primary data which refer to data points that are automatically generated without any further form of processing, as well as data which have been pre-processed for the purpose of making them understandable and useable prior to subsequent processing and analysis fall within the scope of this Regulation. Such data includes data collected from a single sensor or a connected group of sensors for the purpose of making the collected data comprehensible for wider use-cases by determining a physical quantity or quality or the change in a physical quantity, such as temperature, pressure, flow rate, audio, pH value, liquid level, position, acceleration or speed. The term ‘pre-processed data’ should not be interpreted in such a manner as to impose an obligation on the data holder to make substantial investments in cleaning and transforming the data. The data to be made available should include the relevant metadata, including its basic context and timestamp, to make the data usable, combined with other data, such as data sorted and classified with other data points relating to them, or re-formatted into a commonly used format. Such data are potentially valuable to the user and support innovation and the development of digital and other services to protect the environment, health and the circular economy, including through facilitating the maintenance and repair of the connected products in question. By contrast, information inferred or derived from such data, which is the outcome of additional investments into assigning values or insights from the data, in particular by means of proprietary, complex algorithms, including those that are a part of proprietary software, should not be considered to fall within the scope of this Regulation and consequently should not be subject to the obligation of a data holder to make it available to a user or a data recipient, unless otherwise agreed between the user and the data holder. Such data could include, in particular, information derived by means of sensor fusion, which infers or derives data from multiple sensors, collected in the connected product, using proprietary, complex algorithms and which could be subject to intellectual property rights.'''
verdict = "relevant"
fact = 1
quote = "The data represent the digitisation of user actions and events and should accordingly be accessible to the user."

[[chunks]]
question_id = "supplier-registry-content"
chunk = "enisa-nis2-implementation-guidance#233"
question = "Under NIS2, what information should we keep on record about our suppliers?"
answer = "Required (Implementing Regulation (EU) 2024/2690, Annex, point 5.2): an up-to-date registry of direct suppliers and service providers, with the contact points for each one and the list of ICT products, ICT services and ICT processes they provide. Recommended by ENISA: also record the start and end dates of each contract and the supplier's region, classify suppliers (e.g. critical, strategic, routine) based on criteria such as asset sensitivity and risk, and review the registry at least annually or when significant changes occur."
facts = [
  "a list of ICT products, ICT services and ICT processes provided by the direct supplier or service provider",
  "end dates of the contract and the region of each direct supplier and service provider",
]
location = "ENISA NIS2 implementation guidance, ANNEX II GLOSSARY, p. 168"
text = '''
Asset: anything that is of value to the entity, including information. Overall, the assets of a network and information system are personnel, processes, information, software and hardware.
Crisis: an abnormal or extraordinary event or situation that threatens an organisation or community and requires a strategic, adaptive and timely response to preserve its viability and integrity ( 110 ).
Critical: one of the classification levels assigned to the entity's assets following an assessment of their criticality, including the asset classification (Annex to the regulation, point 12.1).
Cyber hygiene practices ( 111 ):
· Cyber hygiene practices for essential and important entities are a common baseline set of network and information security practices, which are already covered by the technical and methodological requirements of the cybersecurity risk-management measures outlined in the Annex to the regulation. Therefore, no additional guidance on cyber hygiene practices for essential and important entities is deemed necessary.
· Cyber hygiene practices relating to users are a set of routine, proactive practices and behaviours that the entity's users follow to maintain the network and information security of the entity's systems. These practices are explicitly mentioned in the guidance of section 8.1.
Direct suppliers and service providers: any entity providing ICT products, ICT systems or ICT services that an essential or important entity relies on. When this guidance refers to direct suppliers and service providers, it includes their personnel.
Entity: one of the relevant entities in the scope of Commission Implementing Regulation (EU) 2024/2690. In other standards or good practice guides, the term 'organisation', 'enterprise' or 'business' may be used.
Event: in reference to an information security event, an identified occurrence indicating a possible information security breach or failure of controls ( 112 ).
Facilities: the physical location housing the entity's network and information systems.
Incident handling: any actions and procedures aiming to prevent, detect, analyse and contain, or to respond to and recover from, an incident (NIS2 Directive Article 6(8)).
Incident: an event compromising the availability, authenticity, integrity or confidentiality of stored, transmitted or processed data or of the services offered by, or accessible through, network and information systems (NIS2 Directive Article 6(6)).
Information: data in context. In the text, we primarily use 'information', unless we refer specifically to data ('data breach' etc.).
Management bodies: the highest-level leadership within essential and important entities as in the context of Article 20 of the NIS2 Directive.'''
verdict = "rejected"
fact = 0
quote = ""

