| Reporting timelines | Many respondents were of the view that the reporting timelines are too short and that they should be extended or that the data fields requested significantly reduced. The main argument presented is that FEs will be handling the incident at the time of reporting and that some of the information requested requires input from various functions. Some of the respondents also indicated that the proposed timelines, in particular for the intermediate report, are more stringent than any existing framework. Finally, several respondents were of the view that the reporting timelines should be aligned with NIS2 Directive. | The ESA agree with the concerns expressed by the respondents to the public consultation and the arguments provided. Accordingly, the ESAs have introduced changes to the RTS to address these, by both extending the reporting timelines for the intermediate and final reports, and by removing certain data fields or moving them to subsequent reports. On the latter point, the ESAs in particular streamlined the data fields requested with the initial report to not pose burden on FEs while they handle incidents. With regard to the timelines and the interplay with NIS2, the ESAs leveraged between several objectives of retaining a harmonised approach for all FEs, retaining the effect of the requirements to at least equivalent effect to NIS2 (in line with Art 4 of NIS2) and to reduce the required efforts by FEs while handling an incident. Accordingly, the ESAs have amended only the intermediate and final report within the boundaries set out by NIS2. | See specific changes covered in the entire feedback table. |
