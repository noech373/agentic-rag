text = '''
129. Even if the attacker was probably not aiming at collecting personal data, since the breach could lead to both material (e.g. financial loss) and non-material damage (e.g. identity theft or fraud), or the data could be used to facilitate other attacks (e.g. phishing), the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons. Therefore the breach should be communicated to all 99 employees and not only to the 10 employees whose salary information was leaked.
130. After becoming aware of the breach, the controller forced a password change for the compromised accounts, blocked sending emails to the attacker's email account, notified the service provider of the email used by the attacker regarding his or her actions, removed the rules set by the attacker and refined the alerts of the monitoring system in order to give an alert as soon as an automatic rule is created. Alternatively, the controller could remove the right for users to set forwarding rules, needing the IT service team to do it only on request or it could introduce a policy that users should check and report on the rules set on their accounts once per week or more often, in areas handling financial data.
131. The fact that a breach could happen and go undetected for so long and the fact that, in a longer time, social engineering could have been used for altering more data, highlighted significant problems in the controller's IT security system. These should be addressed without delay, like emphasizing automation reviews and change controls, incident detection and response measures. Controllers handling sensitive data, financial information, etc. have a larger responsibility in terms of providing adequate data security.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "job-applicant-ranking-high-risk"
chunk = "ai-act#211"
question = "We use an AI tool to rank job candidates. Is it considered high-risk under the AI Act?"
answer = "Yes: AI systems used for the recruitment or selection of people, in particular to filter applications and evaluate candidates, are listed in Annex III (point 4(a)), and Annex III systems are considered high-risk (AI Act, Article 6(2)). The derogation of Article 6(3) (narrow procedural task, etc.) does not help if the tool performs profiling of natural persons, in which case it is always high-risk; a candidate-ranking tool will typically do so."
facts = [
  "intended to be used for the recruitment or selection of natural persons, in particular to place targeted job advertisements | in particular for the recruitment and selection of persons, for making decisions affecting terms of the work-related relationship",
  "AI systems referred to in Annex III shall be considered to be high-risk",
  "shall always be considered to be high-risk where the AI system performs profiling of natural persons | should be considered to pose significant risks of harm to the health, safety or fundamental rights if the AI system implies profiling",
]
location = "AI Act, Article 14"
text = '''
1. High-risk AI systems shall be designed and developed in such a way, including with appropriate human-machine interface tools, that they can be effectively overseen by natural persons during the period in which they are in use.
2. Human oversight shall aim to prevent or minimise the risks to health, safety or fundamental rights that may emerge when a high-risk AI system is used in accordance with its intended purpose or under conditions of reasonably foreseeable misuse, in particular where such risks persist despite the application of other requirements set out in this Section.
3. The oversight measures shall be commensurate with the risks, level of autonomy and context of use of the high-risk AI system, and shall be ensured through either one or both of the following types of measures:
(a) measures identified and built, when technically feasible, into the high-risk AI system by the provider before it is placed on the market or put into service;
(b) measures identified by the provider before placing the high-risk AI system on the market or putting it into service and that are appropriate to be implemented by the deployer.
4. For the purpose of implementing paragraphs 1, 2 and 3, the high-risk AI system shall be provided to the deployer in such a way that natural persons to whom human oversight is assigned are enabled, as appropriate and proportionate:
(a) to properly understand the relevant capacities and limitations of the high-risk AI system and be able to duly monitor its operation, including in view of detecting and addressing anomalies, dysfunctions and unexpected performance;
(b) to remain aware of the possible tendency of automatically relying or over-relying on the output produced by a high-risk AI system (automation bias), in particular for high-risk AI systems used to provide information or recommendations for decisions to be taken by natural persons;
(c) to correctly interpret the high-risk AI system’s output, taking into account, for example, the interpretation tools and methods available;
(d) to decide, in any particular situation, not to use the high-risk AI system or to otherwise disregard, override or reverse the output of the high-risk AI system;
(e) to intervene in the operation of the high-risk AI system or interrupt the system through a ‘stop’ button or a similar procedure that allows the system to come to a halt in a safe state.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "lawful-bases"
