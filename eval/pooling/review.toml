question_id = "max-fines"
chunk = "edpb-guidelines-2022-09#14"
question = "What are the maximum administrative fines under the GDPR?"
answer = "There are two tiers. Up to EUR 10 million or, for an undertaking, up to 2 % of total worldwide annual turnover of the preceding financial year, whichever is higher, for infringements such as the obligations of controllers and processors (Article 83(4)). Up to EUR 20 million or 4 % of worldwide annual turnover, whichever is higher, for infringements of the basic principles, consent conditions, data subjects' rights, international transfers, and for non-compliance with a supervisory authority's order (Article 83(5) and (6))."
facts = [
  "up to 10 000 000 EUR, or in the case of an undertaking, up to 2 % of the total worldwide annual turnover",
  "up to 20 000 000 EUR, or in the case of an undertaking, up to 4 % of the total worldwide annual turnover",
]
location = "EDPB Guidelines 9/2022, 3. The possible consequences of a personal data breach, p. 9"
text = '''
28. If controllers fail to notify either the supervisory authority or data subjects of a data breach or both even though the requirements of Articles 33 and/or 34 GDPR are fulfilled, then the supervisory authority is presented with a choice that must include consideration of all of the corrective measures at its disposal, which would include consideration of the imposition of the appropriate administrative fine 22 , either accompanying a corrective measure under Article 58(2) GDPR or on its own. Where an administrative fine is chosen, its value can be up to 10,000,000 EUR or up to 2 % if the total worldwide annual turnover of an undertaking under Article 83(4)(a) of the GDPR. It is also important to bear in mind that in some cases, the failure to notify a breach could reveal either an absence of existing security measures or an inadequacy of the existing security measures. The WP29 Guidelines on administrative fines state: "The occurrence of several different infringements committed together in any particular single case means that the supervisory authority is able to apply the administrative fines at a level which is effective, proportionate and dissuasive within the limit of the gravest infringement". In that case, the supervisory authority will also have the possibility to issue sanctions for failure to notify or communicate the breach (Articles 33 and 34 GDPR) on the one hand, and absence of (adequate) security measures (Article 32 GDPR) on the other hand, as they are two separate infringements.'''
verdict = "relevant"
