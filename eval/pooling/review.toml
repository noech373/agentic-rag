question = "What are the lawful bases on which personal data may be processed under the GDPR?"
answer = "Processing is lawful only if at least one of six bases applies (Article 6(1)): (a) the data subject's consent for one or more specific purposes; (b) necessity for the performance of a contract with the data subject or for pre-contractual steps at their request; (c) compliance with a legal obligation of the controller; (d) protection of the vital interests of the data subject or another natural person; (e) performance of a task carried out in the public interest or in the exercise of official authority vested in the controller; (f) the legitimate interests of the controller or a third party, unless overridden by the data subject's interests or fundamental rights and freedoms."
facts = [
  "the data subject has given consent to the processing of his or her personal data for one or more specific purposes | the data subject has given his or her explicit consent to the processing",
  "processing is necessary for the performance of a contract to which the data subject is party | the processing is necessary for the performance or preparation of a contract between the data subject and the body",
  "processing is necessary for compliance with a legal obligation to which the controller is subject | The legal obligation: the processing is imposed by regulatory texts",
  "processing is necessary in order to protect the vital interests of the data subject or of another natural person | protect of vital interests may be used as a legal basis",
  "processing is necessary for the performance of a task carried out in the public interest",
  "processing is necessary for the purposes of the legitimate interests pursued by the controller or by a third party | the organization has a \"legitimate\" interest in carrying out the processing",
]
location = "CNIL GDPR Developer Guide, Choose the appropriate legal basis"
text = '''
* First of all, check on the CNIL website that **a text does not impose any particular constraints** (for example: cookies and other trackers).
* **Only one legal basis must be chosen** for a given purpose. Legal basis cannot be cumulated for the same purpose. The same data processing operation may pursue several purposes and a legal basis must then be defined for each of them.
* As mentioned above, if you are a **public authority**, the legal obligation and the public interest mission will be the most relevant in most cases.
* If your processing operation is part of a contractual relationship and its purpose is objectively and strictly necessary for the provision of the user's service (e.g. name, first name and address to create an account on an e-commerce site) then **contract should be appropriate**.
* If your processing is not part of a contractual relationship with the user, then **the legal basis of consent or legitimate interest** may be invoked. If your processing is potentially intrusive (profiling, collection of geolocation data, etc.) then **consent is likely to be the appropriate legal basis**.
* If your processing contains **sensitive data** (health data, data concerning life or sexual orientation, etc.), then you will need to identify, in addition to the legal basis, an exception provided for by Article 9 of the GDPR.'''
verdict = "relevant"
fact = [1, 2, 3, 5, 6]
quote = ["not part of a contractual relationship with the user, then **the legal basis of consent or legitimate interest** may be invoked.", "then **contract should be appropriate**", "the legal obligation and the public interest mission will be the most relevant", "the public interest mission will be the most relevant in most cases", "**the legal basis of consent or legitimate interest** may be invoked"]

