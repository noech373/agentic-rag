[[chunks]]
question_id = "supplier-registry-content"
chunk = "enisa-nis2-implementation-guidance#92"
question = "Under NIS2, what information should we keep on record about our suppliers?"
answer = "Required (Implementing Regulation (EU) 2024/2690, Annex, point 5.2): an up-to-date registry of direct suppliers and service providers, with the contact points for each one and the list of ICT products, ICT services and ICT processes they provide. Recommended by ENISA: also record the start and end dates of each contract and the supplier's region, classify suppliers (e.g. critical, strategic, routine) based on criteria such as asset sensitivity and risk, and review the registry at least annually or when significant changes occur."
facts = [
  "a list of ICT products, ICT services and ICT processes provided by the direct supplier or service provider",
  "end dates of the contract and the region of each direct supplier and service provider",
]
location = "ENISA NIS2 implementation guidance, Point 5.1.4, p. 69"
text = '''
GUIDANCE
· Ensure that, in all relevant new and renewed contracts, the requirements from point 5.1.4 of the Annex to the regulation are included.
· When dealing with large suppliers and service providers consider one or more of the following measures (indicative, non-exhaustive list):
o collective bargaining by teaming up with similar size organisations for purchasing products or services in bulk;
o representation by an association of which the entity is a member of;
o legal advice for reviewing and negotiating a contract;
o negotiating specific clauses such as exit, pricing and SLAs ( 43 );
o suppliers that publicly publish their security, privacy or reliability commitments;
o providers with standard certifications (e.g. ISO 27001, SOC 2);
o trusted platforms or marketplaces that vet suppliers (e.g. app stores, SaaS directories, partner networks);
o contract templates or free legal checklists from small business associations, NGOs or government sites;
o tools/services that allow easy data export, monthly payments or no lock-in;
o avoiding long-term commitments or vendor lock-in without clear exit strategies; and
o a short list of alternatives in case the supplier becomes unavailable.
EXAMPLES OF EVIDENCE
· Contracts that contain the elements referred to in point 5.1.4 of the Annex to the regulation.'''
verdict = "rejected"
