question = "Can I show a prospect a demo built with real data from another client?"
answer = "No. As a processor, you may process the client's personal data only on its documented instructions (GDPR Article 28(3)(a)); a processor that determines the purposes and means of a processing itself is considered a controller for it and infringes the GDPR (Article 28(10)). The CNIL also warns that using real production data outside production diverts it from its original purpose and increases security risks: build a dummy data set that looks like the real data instead (CNIL developer guide, sheet 11)."
