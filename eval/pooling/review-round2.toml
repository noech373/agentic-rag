chunk = "edpb-guidelines-2021-01#28"
question = "We are a French company running an e-commerce site with buyers in several EU countries. Hackers published our users' login credentials and order history online. Who do we have to notify, and what should we do to limit the damage?"
answer = "Both the lead supervisory authority and the affected users must be notified, as the breach could lead to a high risk. The company should also mitigate the risk, for example by forcing a password reset of the affected accounts, and check whether other notification obligations apply."
facts = [
  "Yes, report to lead supervisory authority if involves cross-border processing | in the event of a breach involving cross-border processing, notification must be made to the lead supervisory authority",
  "Yes, as could lead to high risk | If these risks are high, the organization must also inform the persons concerned as soon as possible | likely to result in a high risk to the rights and freedoms of natural persons. Therefore the breach should be communicated",
  "forcing password resets of the affected accounts | forced password resets of the compromised accounts | the controller forced a password change for the compromised accounts",
  "The controller should also consider any other notification obligations",
]
location = "EDPB Guidelines 01/2021, 3.1.2 CASE No. 05 -Mitigation and obligations, p. 16"
text = '''
54. If possible, after solving the problem, the database should be compared with the one stored in a secure backup. The experiences drawn from the breach should be utilized in updating the IT infrastructure. The data controller should return all affected IT systems to a known clean state, remedy the vulnerability and implement new security measures to avoid similar data breaches in the future, e.g. file integrity checks and security audits. If personal data was not only exfiltrated, but also deleted, the controller has to take systematic action to recover the personal data in the state it was in before the breach. It may be necessary to apply full backups, incremental changes and then possibly rerun the processing since the last incremental backup - which requires that the controller is able to replicate the changes made since the last backup. This could require that the controller has the system designed to retain the daily input files in case they need to be processed again and requires a robust method of storage and a suitable retention policy.
55. In light of the above, as the breach is likely to result in a high risk to the rights and freedoms of natural persons, the data subjects should definitely be informed about it (Article 34(1)), which of course means that the relevant SA(s) should also be involved in the form of a data breach notification. Documenting the breach is obligatory according to Article 33 (5) GDPR and makes the assessment of the situation easier.'''
verdict = "relevant"
fact = 2
quote = "likely to result in a high risk to the rights and freedoms of natural persons, the data subjects should definitely be informed about it"

