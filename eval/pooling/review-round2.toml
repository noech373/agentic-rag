# Pooling review: does each chunk state one of the facts its question needs? Judge without
# looking at the LLM's verdicts (eval/pooling/llm.jsonl): the agreement is measured on this file.
#
# Set `verdict` to:
# - "relevant" if the chunk, read alone, states one of the `facts` (in any words; a recital
#   counts): set `fact` to its number in `facts` (1 for the first) and `quote` to the words of
#   the chunk that state it, copied exactly (4 to 25 words); if it states several facts, give
#   lists in the same order: `fact = [1, 3]` and `quote = ["…", "…"]`;
# - "new_fact" if it states something a good answer needs that no fact lists (the question
#   misses a fact): keep `fact = 0` and put its words in `quote`;
# - "rejected" otherwise (same topic only, a reference without the fact, or a mere extra).


[[chunks]]
question_id = "ai-act-high-risk-logs-retention"
chunk = "ai-act#217"
question = "We deploy a high-risk AI system under the AI Act. Do we have to keep the logs it generates, and for how long?"
answer = "Yes: high-risk AI systems must technically allow the automatic recording of events (logs) over their lifetime (AI Act, Article 12(1)), and deployers must keep the logs automatically generated, to the extent they are under their control, for a period appropriate to the intended purpose of at least six months, unless Union or national law (in particular on personal data) provides otherwise (Article 26(6))."
facts = [
  "Deployers of high-risk AI systems shall keep the logs automatically generated by that high-risk AI system",
  "under their control, for a period appropriate to the intended purpose of the high-risk AI system, of at least six months",
]
location = "AI Act, Article 18"
text = '''
1. The provider shall, for a period ending 10 years after the high-risk AI system has been placed on the market or put into service, keep at the disposal of the national competent authorities:
(a) the technical documentation referred to in Article 11;
(b) the documentation concerning the quality management system referred to in Article 17;
(c) the documentation concerning the changes approved by notified bodies, where applicable;
(d) the decisions and other documents issued by the notified bodies, where applicable;
(e) the EU declaration of conformity referred to in Article 47.
2. Each Member State shall determine conditions under which the documentation referred to in paragraph 1 remains at the disposal of the national competent authorities for the period indicated in that paragraph for the cases when a provider or its authorised representative established on its territory goes bankrupt or ceases its activity prior to the end of that period.
3. Providers that are financial institutions subject to requirements regarding their internal governance, arrangements or processes under Union financial services law shall maintain the technical documentation as part of the documentation kept under the relevant Union financial services law.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-high-risk-testing-before-market"
chunk = "ai-act#316"
question = "Before placing a high-risk AI system on the market, what testing does the AI Act require?"
answer = "High-risk AI systems must be tested to identify the most appropriate risk management measures and to ensure they perform consistently for their intended purpose and comply with the requirements (AI Act, Article 9(6)). Testing is performed throughout development and in any event before placing on the market or putting into service, against prior defined metrics and probabilistic thresholds appropriate to the intended purpose (Article 9(8)). The provider's quality management system must also set out the examination, test and validation procedures to be carried out before, during and after development, and how often (Article 17(1)(d))."
facts = [
  "in any event, prior to their being placed on the market or put into service",
  "Testing shall be carried out against prior defined metrics and probabilistic thresholds",
  "examination, test and validation procedures to be carried out before, during and after the development of the high-risk AI system",
]
location = "AI Act, Article 82"
text = '''
1. Where, having performed an evaluation under Article 79, after consulting the relevant national public authority referred to in Article 77(1), the market surveillance authority of a Member State finds that although a high-risk AI system complies with this Regulation, it nevertheless presents a risk to the health or safety of persons, to fundamental rights, or to other aspects of public interest protection, it shall require the relevant operator to take all appropriate measures to ensure that the AI system concerned, when placed on the market or put into service, no longer presents that risk without undue delay, within a period it may prescribe.
2. The provider or other relevant operator shall ensure that corrective action is taken in respect of all the AI systems concerned that it has made available on the Union market within the timeline prescribed by the market surveillance authority of the Member State referred to in paragraph 1.
3. The Member States shall immediately inform the Commission and the other Member States of a finding under paragraph 1. That information shall include all available details, in particular the data necessary for the identification of the AI system concerned, the origin and the supply chain of the AI system, the nature of the risk involved and the nature and duration of the national measures taken.
4. The Commission shall without undue delay enter into consultation with the Member States concerned and the relevant operators, and shall evaluate the national measures taken. On the basis of the results of that evaluation, the Commission shall decide whether the measure is justified and, where necessary, propose other appropriate measures.
5. The Commission shall immediately communicate its decision to the Member States concerned and to the relevant operators. It shall also inform the other Member States.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-job-application-sorting-not-high-risk"
chunk = "ai-act#61"
question = "Our tool only sorts incoming job applications into folders by language, without ranking anyone. Is it still high-risk under the AI Act?"
answer = "Probably not. AI systems used to analyse and filter job applications are listed in Annex III (point 4(a)), but an Annex III system is not high-risk when it does not pose a significant risk of harm, in particular when it is intended to perform a narrow procedural task (AI Act, Article 6(3)(a)), unless it performs profiling of natural persons, in which case it is always high-risk. The provider who considers it not high-risk must document that assessment before placing it on the market and register it (Article 6(4))."
facts = [
  "in particular to place targeted job advertisements, to analyse and filter job applications, and to evaluate candidates",
  "the AI system is intended to perform a narrow procedural task | an AI system that classifies incoming documents into categories",
  "shall always be considered to be high-risk where the AI system performs profiling of natural persons",
  "A provider who considers that an AI system referred to in Annex III is not high-risk shall document its assessment",
]
location = "AI Act, Recital 62"
text = '''
(62) Without prejudice to the rules provided for in Regulation (EU) 2024/900 of the European Parliament and of the Council, and in order to address the risks of undue external interference with the right to vote enshrined in Article 39 of the Charter, and of adverse effects on democracy and the rule of law, AI systems intended to be used to influence the outcome of an election or referendum or the voting behaviour of natural persons in the exercise of their vote in elections or referenda should be classified as high-risk AI systems with the exception of AI systems whose output natural persons are not directly exposed to, such as tools used to organise, optimise and structure political campaigns from an administrative and logistical point of view.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "ai-act-third-party-gpai-model"
chunk = "ai-act#268"
question = "We build an assistant on top of a third-party general-purpose AI model. Under the AI Act, what must the model provider give us, and are we a provider ourselves?"
answer = "The provider of the general-purpose AI model must draw up, keep up to date and make available information and documentation to the providers who integrate the model into their AI systems, so that they understand its capabilities and limitations and can comply with their own obligations (AI Act, Article 53(1)(b), detailed in Annex XII). By integrating the model into your assistant you are a 'downstream provider': the provider of your own AI system, whoever supplies the model (Article 3(68)), and you bear the obligations attached to that system."
facts = [
  "make available information and documentation to providers of AI systems who intend to integrate the general-purpose AI model into their AI systems | the technical means (e.g. instructions for use, infrastructure, tools) required for the general-purpose AI model to be integrated into AI systems",
  "good understanding of the capabilities and limitations of the general-purpose AI model and to comply with their obligations | downstream providers that necessitate a good understanding of the models and their capabilities",
  "means a provider of an AI system, including a general-purpose AI system, which integrates an AI model",
]
location = "AI Act, Article 53"
text = '''
4. Providers of general-purpose AI models may rely on codes of practice within the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of this Article, until a harmonised standard is published. Compliance with European harmonised standards grants providers the presumption of conformity to the extent that those standards cover those obligations. Providers of general-purpose AI models who do not adhere to an approved code of practice or do not comply with a European harmonised standard shall demonstrate alternative adequate means of compliance for assessment by the Commission.
5. For the purpose of facilitating compliance with Annex XI, in particular points 2 (d) and (e) thereof, the Commission is empowered to adopt delegated acts in accordance with Article 97 to detail measurement and calculation methodologies with a view to allowing for comparable and verifiable documentation.
6. The Commission is empowered to adopt delegated acts in accordance with Article 97(2) to amend Annexes XI and XII in light of evolving technological developments.
7. Any information or documentation obtained pursuant to this Article, including trade secrets, shall be treated in accordance with the confidentiality obligations set out in Article 78.'''
verdict = "rejected"
