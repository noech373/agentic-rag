[[chunks]]
question_id = "breach-no-notification-individuals"
chunk = "edpb-guidelines-2021-01#41"
question = "Are there situations where I don't need to inform the individuals concerned by a breach?"
answer = "Yes. First, communication to data subjects is only required when the breach is likely to result in a high risk to their rights and freedoms (GDPR Art. 34(1)); otherwise only the supervisory authority may need to be notified. Even with a high risk, it is not required if (a) appropriate protection measures such as encryption rendered the data unintelligible, (b) subsequent measures ensure the high risk is no longer likely to materialise, or (c) it would involve disproportionate effort, in which case a public communication is made instead (Art. 34(3)). The controller must be able to demonstrate this, and the supervisory authority can still require communication (Art. 34(4))."
facts = [
  "those that render the personal data unintelligible to any person who is not authorised to access it, such as encryption | Article 34(3) GDPR states three conditions that, if met, do not require notification to individuals | the data are in principle unintelligible. Thus, the breach is unlikely to adversely affect individuals and therefore would not require communication to those individuals | if personal data have been made essentially unintelligible to unauthorised parties and where the data are a copy or a backup exists",
  "high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject | Communication of a breach to the individual is only triggered where it is likely to result in a high risk",
]
location = "EDPB Guidelines 01/2021, 4.1.2 CASE No. 08 -Mitigation and obligations, p. 21"
text = '''
75. The mitigation of the adverse effects of the breach in the above case is difficult. It might need to involve immediate legal action to prevent the former employee from abusing and disseminating the data any further. As a next step, the avoidance of similar future situations should be the goal. The controller might try to order the ex-employee to stop using the data, but the success of this action is dubious at best. Appropriate technical measures such as the impossibility of copying or downloading data to removable devices may help.
76. There is no "one-size fits-all" solution to these kinds of cases, but a systematic approach may help to prevent them. For example, the company may consider - when possible - withdrawing certain forms of access from employees who have signalled their intention to quit or implementing access logs so that unwanted access can be logged and flagged. The contract signed with employees should include clauses that prohibit such actions.
77. All in all, as the given breach will not result in a high risk to the rights and freedoms of natural persons, a notification to the SA will suffice. However, the information to the data subjects might be beneficial for the data controller too, since it might be better that they hear from the company about the data leak rather than from the ex-employee who tries to contact them. Data breach documentation in accordance with Article 33 (5) is a legal obligation.'''
verdict = "relevant"
fact = 2
quote = "the given breach will not result in a high risk to the rights and freedoms of natural persons, a notification to the SA will suffice"

[[chunks]]
question_id = "bundled-consent-gym"
chunk = "data-act#135"
question = "My gym says I can only sign up if I agree to them passing my data on to partner brands. Does my 'yes' really count?"
answer = "Probably not. Consent must be freely given (Article 4(11)). When assessing whether it is, utmost account is taken of whether the provision of a service is made conditional on consent to processing that is not necessary for it (Article 7(4)); consent is presumed not freely given in that case (recital 43). Sharing your data with partner brands is not necessary to provide a gym membership, and consent is not freely given if you have no genuine or free choice (recital 42)."
facts = [
  "any freely given, specific, informed and unambiguous indication of the data subject's wishes | Consent should be given by a clear affirmative act establishing a freely given, specific, informed and unambiguous indication of the data subject's agreement",
  "is conditional on consent to the processing of personal data that is not necessary for the performance of that contract | is dependent on the consent despite such consent not being necessary for such performance",
  "Consent should not be regarded as freely given if the data subject has no genuine or free choice",
]
location = "Data Act, Article 6"
text = '''
1. A third party shall process the data made available to it pursuant to Article 5 only for the purposes and under the conditions agreed with the user and subject to Union and national law on the protection of personal data including the rights of the data subject insofar as personal data are concerned. The third party shall erase the data when they are no longer necessary for the agreed purpose, unless otherwise agreed with the user in relation to non-personal data.
2. The third party shall not:
(a) make the exercise of choices or rights under Article 5 and this Article by the user unduly difficult, including by offering choices to the user in a non-neutral manner, or by coercing, deceiving or manipulating the user, or by subverting or impairing the autonomy, decision-making or choices of the user, including by means of a user digital interface or a part thereof;
(b) notwithstanding Article 22(2), points (a) and (c), of Regulation (EU) 2016/679, use the data it receives for the profiling, unless it is necessary to provide the service requested by the user;
(c) make the data it receives available to another third party, unless the data is made available on the basis of a contract with the user, and provided that the other third party takes all necessary measures agreed between the data holder and the third party to preserve the confidentiality of trade secrets;
(d) make the data it receives available to an undertaking designated as a gatekeeper pursuant to Article 3 of Regulation (EU) 2022/1925;
(e) use the data it receives to develop a product that competes with the connected product from which the accessed data originate or share the data with another third party for that purpose; third parties shall also not use any non-personal product data or related service data made available to them to derive insights about the economic situation, assets and production methods of, or use by, the data holder;
(f) use the data it receives in a manner that has an adverse impact on the security of the connected product or related service;
(g) disregard the specific measures agreed with a data holder or with the trade secrets holder pursuant to Article 5(9) and undermine the confidentiality of trade secrets;
(h) prevent the user that is a consumer, including on the basis of a contract, from making the data it receives available to other parties.'''
verdict = "rejected"
fact = 0
quote = ""

