[[chunks]]
question_id = "ip-addresses-personal-data"
chunk = "edpb-guidelines-2021-01#27"
question = "Do I need to treat my visitors' IP addresses as private information?"
answer = "Yes: your visitors' IP addresses are personal data under the GDPR. An IP address is an online identifier which, combined with other information received by servers, can be used to create profiles of people and identify them (GDPR, recital 30), and personal data covers any information relating to a person identifiable by reference to an identifier such as an online identifier (Article 4(1)). The CNIL lists the IP address among examples of personal data where it relates to natural persons."
facts = [
  "online identifiers provided by their devices, applications, tools and protocols, such as internet protocol addresses | IP address, computer connection identifier or cookie identifier",
]
location = "EDPB Guidelines 01/2021, 3.1.1 CASE No. 05 - Prior measures and risk assessment, p. 15"
text = '''
51. The security of the data controller's environment is extremely important, as the majority of these breaches can be prevented by ensuring that all systems are constantly updated, sensitive data is encrypted and
applications are developed according to high security standards like strong authentication, measures against brute force, attacks, "escaping" or "sanitising" 18 user inputs, etc. Periodic IT security audits, vulnerability assessments and penetration tests are also required in order to detect these kinds of vulnerabilities in advance and fix them. In this particular case, file integrity monitoring tools in production environment might have helped to detect the code injection. (A list of advisable measures is to be found in section 3.7).
52. The controller should always start to investigate the breach by identifying the type of the attack and its methods, in order to assess what measures are to be taken. To make it fast and efficient, the data controller should have an incident response plan in place which specifies the swift and necessary steps to take control over the incident. In this particular case, the type of the breach was a risk enhancing factor since not only was data confidentiality curtailed, the infiltrator also had the means to establish changes in the system, so data integrity also became questionable.
53. The nature, sensitivity and volume of personal data affected in the breach should be assessed to determine to what extent the breach affected the data subjects. Though no special categories of personal data were affected, the accessed data contains considerable information about the individuals from the online forms, and such data could be misused in a number of ways (targeting with unsolicited marketing, identity theft, etc.), so the severity of the consequences should increase the risk to the rights and freedoms of the data subjects 19 .'''
verdict = "rejected"
fact = 0
quote = ""

