[[chunks]]
question_id = "data-act-atm-data-compensation"
chunk = "data-act#152"
question = "A bank has asked us, the manufacturer of its ATMs, to send the machines' data to its maintenance contractor. Under the Data Act, can we charge the contractor for it?"
answer = "Yes, while the data stay free of charge for the bank (Data Act, Article 5(1)). The terms must be fair, reasonable and non-discriminatory (Article 8), and the compensation agreed with the contractor must be non-discriminatory and reasonable, and may include a margin (Article 9(1)); it takes into account in particular the costs of making the data available and the investments in collecting and producing them (Article 9(2)). If the contractor is an SME without partner or linked enterprises that are not SMEs, the compensation may not exceed the costs of making the data available (Article 9(4)). You must give the contractor the basis of the calculation in enough detail for it to check these conditions (Article 9(7)), and other Union or national law may exclude or lower the compensation (Article 9(6))."
