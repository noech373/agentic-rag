[[chunks]]
question_id = "dpia-when-required"
chunk = "gdpr#220"
question = "When must a data protection impact assessment be carried out, and which cases are explicitly listed?"
answer = "A DPIA must be carried out before the processing when a type of processing, in particular using new technologies, is likely to result in a high risk to the rights and freedoms of natural persons (Article 35(1)). Article 35(3) explicitly lists three cases: (a) a systematic and extensive evaluation of personal aspects based on automated processing, including profiling, on which decisions with legal or similarly significant effects are based; (b) large-scale processing of special categories of data (Article 9(1)) or of data on criminal convictions and offences (Article 10); (c) systematic monitoring of a publicly accessible area on a large scale."
facts = [
  "prior to the processing, carry out an assessment of the impact of the envisaged processing operations on the protection of personal data | a data protection impact assessment should be carried out by the controller prior to the processing",
  "a systematic and extensive evaluation of personal aspects relating to natural persons which is based on automated processing, including profiling | following any systematic and extensive evaluation of personal aspects relating to natural persons based on profiling those data",
  "processing on a large scale of special categories of data referred to in Article 9(1) | following the processing of special categories of personal data, biometric data, or data on criminal convictions and offences",
  "a systematic monitoring of a publicly accessible area on a large scale | A data protection impact assessment is equally required for monitoring publicly accessible areas on a large scale",
]
location = "GDPR, Article 36"
text = '''
1. The controller shall consult the supervisory authority prior to processing where a data protection impact assessment under Article 35 indicates that the processing would result in a high risk in the absence of measures taken by the controller to mitigate the risk.
2. Where the supervisory authority is of the opinion that the intended processing referred to in paragraph 1 would infringe this Regulation, in particular where the controller has insufficiently identified or mitigated the risk, the supervisory authority shall, within period of up to eight weeks of receipt of the request for consultation, provide written advice to the controller and, where applicable to the processor, and may use any of its powers referred to in Article 58. That period may be extended by six weeks, taking into account the complexity of the intended processing. The supervisory authority shall inform the controller and, where applicable, the processor, of any such extension within one month of receipt of the request for consultation together with the reasons for the delay. Those periods may be suspended until the supervisory authority has obtained information it has requested for the purposes of the consultation.
3. When consulting the supervisory authority pursuant to paragraph 1, the controller shall provide the supervisory authority with:
(a) where applicable, the respective responsibilities of the controller, joint controllers and processors involved in the processing, in particular for processing within a group of undertakings;
(b) the purposes and means of the intended processing;
(c) the measures and safeguards provided to protect the rights and freedoms of data subjects pursuant to this Regulation;
(d) where applicable, the contact details of the data protection officer;
(e) the data protection impact assessment provided for in Article 35; and
(f) any other information requested by the supervisory authority.
4. Member States shall consult the supervisory authority during the preparation of a proposal for a legislative measure to be adopted by a national parliament, or of a regulatory measure based on such a legislative measure, which relates to processing.
5. Notwithstanding paragraph 1, Member State law may require controllers to consult with, and obtain prior authorisation from, the supervisory authority in relation to processing by a controller for the performance of a task carried out by the controller in the public interest, including processing in relation to social protection and public health.'''
verdict = "rejected"
fact = 0
