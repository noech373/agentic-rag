[[chunks]]
question_id = "production-data-evaluation"
chunk = "gdpr#25"
question = "Can we use production data containing personal information to evaluate and fine-tune our models?"
answer = "Not as such: the CNIL says real production data should not be used during development and testing, because using personal data from production for testing diverts it from its original purpose and increases security risks. Build a dummy data set that looks like the real data instead, or anonymise the personal data imported from production (CNIL developer guide, sheet 11). The guide does not mention fine-tuning, which is likewise a use outside the data's original purpose."
facts = [
  "production data should not be used during the development and testing phase | Using personal data from your production database for testing purposes is tantamount to diverting it from its original purpose | collected for specified, explicit and legitimate purposes and not further processed in a manner that is incompatible with those purposes",
  "So build a dummy data set that will look like the data that will be processed by your application | consider anonymizing the personal data that may be present",
]
location = "GDPR, Recital 26"
text = '''
(26) The principles of data protection should apply to any information concerning an identified or identifiable natural person. Personal data which have undergone pseudonymisation, which could be attributed to a natural person by the use of additional information should be considered to be information on an identifiable natural person. To determine whether a natural person is identifiable, account should be taken of all the means reasonably likely to be used, such as singling out, either by the controller or by another person to identify the natural person directly or indirectly. To ascertain whether means are reasonably likely to be used to identify the natural person, account should be taken of all objective factors, such as the costs of and the amount of time required for identification, taking into consideration the available technology at the time of the processing and technological developments. The principles of data protection should therefore not apply to anonymous information, namely information which does not relate to an identified or identifiable natural person or to personal data rendered anonymous in such a manner that the data subject is not or no longer identifiable. This Regulation does not therefore concern the processing of such anonymous information, including for statistical or research purposes.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "pseudonymise-before-indexing"
chunk = "data-act#7"
question = "Do we need to pseudonymise personal data before indexing documents in the RAG pipeline?"
answer = "Not as a general obligation. The controller and the processor must implement technical and organisational measures that ensure a level of security appropriate to the risk (GDPR Article 32(1)); pseudonymisation is one of the measures listed, as appropriate, and also a way to implement data protection by design (Article 25(1)). The CNIL suggests it to reduce the sensitivity of data that is still useful, but pseudonymised data remain personal data, subject to the regulations (CNIL developer guide, sheets 1 and 7): the indexed chunks would still need erasure, access control and a retention period."
facts = [
  "the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk",
  "the pseudonymisation and encryption of personal data | such as pseudonymisation, which are designed to implement data-protection principles | you can reduce its sensitivity by using pseudomisation or even anonymisation methods | the GDPR considers that pseudonymization makes it possible to reduce the risks for data subjects | The application of pseudonymisation to personal data can reduce the risks to the data subjects concerned | can also reduce the likelihood of individuals being identified in the event of a breach",
  "in case of pseudonymization these data remain subject to the regulations on personal data | Data resulting from pseudonymization are considered as personal data and therefore remain subject to the obligations of the GDPR | Personal data which have undergone pseudonymisation, which could be attributed to a natural person by the use of additional information",
]
location = "Data Act, Recital 8"
text = '''
(8) The principles of data minimisation and data protection by design and by default are essential when processing involves significant risks to the fundamental rights of individuals. Taking into account the state of the art, all parties to data sharing, including data sharing falling within scope of this Regulation, should implement technical and organisational measures to protect those rights. Such measures include not only pseudonymisation and encryption, but also the use of increasingly available technology that permits algorithms to be brought to the data and allow valuable insights to be derived without the transmission between parties or unnecessary copying of the raw or structured data themselves.'''
verdict = "rejected"
fact = 0
quote = ""

