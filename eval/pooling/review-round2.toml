chunk = "gdpr#89"
question = "I'm a self-employed physiotherapist and I keep files on my patients. Do I have to do a risk study on that?"
answer = "No, a data protection impact assessment is not mandatory in that case. Recital 91 states that processing of patients' or clients' data by an individual physician, other health care professional or lawyer should not be considered large-scale, and that a DPIA should then not be mandatory."
