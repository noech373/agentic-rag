[[chunks]]
question_id = "network-segmentation-evidence"
chunk = "enisa-nis2-implementation-guidance#163"
question = "Under NIS2, what proof could I give an auditor to show that my network is segmented?"
answer = "Documented segmentation rules based on standards (6.8.1); risk assessments justifying the segmentation, up-to-date network diagrams showing zones (DMZ, internal, guest), VLAN, router/switch and firewall configurations matching the documented rules (6.8.2); evidence of periodic review such as pentests/vulnerability scans covering segmentation and review schedules (6.8.3)."
facts = [
  "Up-to-date network diagrams showing segmentation into different networks or zones | Configuration settings that match documented segmentation rules and diagrams | Documented network segmentation rules based on relevant standards and good practices",
  "Penetration tests and vulnerability assessments that include evaluations of network segmentation | Plans or schedules for reviewing network segmentation rules",
]
location = "ENISA NIS2 implementation guidance, Point 9.2, p. 120"
text = '''
· Documented policy on cryptography in line with relevant regulations and state-of-the-art standards.
· Documented guidelines for encryption.
· Acceptable encryption algorithms, key lengths, protocols ( 88 ) or family of protocols ( 89 ) in line with the state of the art.
· Safeguards to protect the secrecy of secret (private) key(s) in place.
· Evidence of the existence of cryptographic mechanisms that support ensuring the confidentiality and integrity of the data at rest and in transit.
· Evidence of the existence of a mechanism (either manual or automated) for the establishment and management of cryptographic keys.
· Evidence of encryption implementation on various systems (e.g. databases, files, communications).
· Access control mechanisms for cryptographic keys and encrypted data.
· Verification that access is restricted to authorized personnel and that actions related to cryptographic keys are logged and monitored.
· Assessments of cryptographic measures for protecting data privacy.
· Evidence of secure key generation.
· Internal or external audit reports focusing on cryptographic measures.
· Evidence that the entity follows cryptographic best practices, including documentation of how new best practices are identified and incorporated.'''
