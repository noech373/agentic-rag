[[chunks]]
question_id = "ai-act-training-data-governance"
chunk = "ai-act#382"
question = "Our high-risk AI system is trained on our own data. What does the AI Act require us to document about where that data comes from and about bias?"
answer = "High-risk AI systems trained with data must use training, validation and testing data sets subject to data governance and management practices (AI Act, Article 10(1)-(2)). These cover in particular the data collection processes and the origin of the data, and for personal data the original purpose of the collection (Article 10(2)(b)), the examination of possible biases likely to affect health and safety, fundamental rights or lead to discrimination (Article 10(2)(f)), and the measures to detect, prevent and mitigate those biases (Article 10(2)(g))."
facts = [
  "data collection processes and the origin of data, and in the case of personal data, the original purpose of the data collection | information about their provenance, scope and main characteristics; how the data was obtained and selected | data governance and management practices should include, in the case of personal data, transparency about the original purpose of the data collection",
  "examination in view of possible biases that are likely to affect the health and safety of persons | the mitigation of possible biases in the data sets, that are likely to affect the health and safety of persons",
  "appropriate measures to detect, prevent and mitigate possible biases identified according to point (f)",
]
location = "AI Act, Annex XI"
text = '''
Additional information to be provided by providers of general-purpose AI models with systemic risk
1. A detailed description of the evaluation strategies, including evaluation results, on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies. Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification of limitations.
2. Where applicable, a detailed description of the measures put in place for the purpose of conducting internal and/or external adversarial testing (e.g. red teaming), model adaptations, including alignment and fine-tuning.
3. Where applicable, a detailed description of the system architecture explaining how software components build or feed into each other and integrate into the overall processing.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "bank-simulated-attack-frequency"
chunk = "dora#126"
question = "How often does a bank have to run a simulated attack on its live systems?"
answer = "Only banks that their competent authority has identified as required to perform threat-led penetration testing (TLPT) must do so, at least every 3 years; the authority may ask for a lower or higher frequency based on the bank's risk profile (DORA, Art. 26(1))."
facts = [
  "shall carry out at least every 3 years advanced testing by means of TLPT",
]
location = "DORA, Article 10"
text = '''
1. Financial entities shall have in place mechanisms to promptly detect anomalous activities, in accordance with Article 17, including ICT network performance issues and ICT-related incidents, and to identify potential material single points of failure.
All detection mechanisms referred to in the first subparagraph shall be regularly tested in accordance with Article 25.
2. The detection mechanisms referred to in paragraph 1 shall enable multiple layers of control, define alert thresholds and criteria to trigger and initiate ICT-related incident response processes, including automatic alert mechanisms for relevant staff in charge of ICT-related incident response.
3. Financial entities shall devote sufficient resources and capabilities to monitor user activity, the occurrence of ICT anomalies and ICT-related incidents, in particular cyber-attacks.
4. Data reporting service providers shall, in addition, have in place systems that can effectively check trade reports for completeness, identify omissions and obvious errors, and request re-transmission of those reports.'''
