question_id = "child-consent-age"
chunk = "gdpr#42"
question = "From what age can a child consent alone to an online service, and how low can a Member State set that age?"
answer = "For information society services offered directly to a child, the child can consent alone from 16 years old; below that, consent must be given or authorised by the holder of parental responsibility. Member States may set a lower age by law, but not below 13 years (Article 8(1))."
facts = [
  "the processing of the personal data of a child shall be lawful where the child is at least 16 years old",
  "Member States may provide by law for a lower age for those purposes provided that such lower age is not below 13 years.",
]
location = "GDPR, Recital 43"
text = '''
(43) In order to ensure that consent is freely given, consent should not provide a valid legal ground for the processing of personal data in a specific case where there is a clear imbalance between the data subject and the controller, in particular where the controller is a public authority and it is therefore unlikely that consent was freely given in all the circumstances of that specific situation. Consent is presumed not to be freely given if it does not allow separate consent to be given to different personal data processing operations despite it being appropriate in the individual case, or if the performance of a contract, including the provision of a service, is dependent on the consent despite such consent not being necessary for such performance.'''
verdict = "rejected"
fact = 0
quote = ""

[[chunks]]
question_id = "cloud-provider-contract-content"
chunk = "data-act#101"
question = "We are a bank and outsource the processing of our customers' personal data to a cloud provider. Under the GDPR and DORA, what must the contract say about what is processed, on whose instructions, and where?"
answer = "GDPR (Article 28(3)): the contract must set out the subject-matter and duration, the nature and purpose of the processing, the type of personal data and the categories of data subjects, and stipulate that the processor acts only on the controller's documented instructions, including for transfers to third countries. DORA (Article 30(2)(a)-(b)), which applies because a bank is a financial entity: a clear and complete description of all functions and ICT services provided, and the locations (regions or countries) where they are provided and where data is processed, including storage, with prior notice from the provider before any change of location. Both texts require more (e.g. confidentiality, audits, exit, and Article 30(3) for critical or important functions)."
facts = [
  "the subject-matter and duration of the processing, the nature and purpose of the processing, the type of personal data and categories of data subjects | the subject-matter and duration of the processing, the nature and purposes of the processing, the type of personal data",
  "processes the personal data only on documented instructions from the controller",
  "a clear and complete description of all functions and ICT services to be provided by the ICT third-party service provider",
  "where the contracted or subcontracted functions and ICT services are to be provided and where data is to be processed",
]
location = "Data Act, Recital 102"
text = '''
(102) To foster further trust in data, it is important that safeguards to ensure control of their data by Union citizens, the public sector bodies and businesses are implemented to the extent possible. In addition, Union law, values and standards regarding, inter alia, security, data protection and privacy, and consumer protection should be upheld. In order to prevent unlawful governmental access to non-personal data by third-country authorities, providers of data processing services subject to this Regulation, such as cloud and edge services, should take all reasonable measures to prevent access to systems on which non-personal data are stored, including, where relevant, through the encryption of data, frequent submission to audits, verified adherence to relevant security reassurance certification schemes, and by the modification of corporate policies.'''
verdict = "rejected"
fact = 0
quote = ""

