[[chunks]]
question_id = "dora-automated-failover"
chunk = "dora#122"
question = "We are a bank. Do we need automated failover for our critical APIs to meet DORA's resilience requirements?"
answer = "DORA does not require the failover to be automated, but it requires redundancy. Financial entities other than microenterprises must maintain redundant ICT capacities adequate to ensure business needs (Article 12(4)), design and use ICT assets and services so as to ensure the redundancy of all critical components (Article 11(5)), and include in their testing plans switchovers between the primary ICT infrastructure and the redundant capacity (Article 11(6)). The automated mechanisms mentioned in Article 9(4)(b) concern the isolation of affected assets during cyber-attacks, not failover."
facts = [
  "shall maintain redundant ICT capacities equipped with resources, capabilities and functions that are adequate to ensure business needs",
  "adequately ensuring the redundancy of all critical components",
  "scenarios of cyber-attacks and switchovers between the primary ICT infrastructure and the redundant capacity",
]
location = "DORA, Article 7"
text = '''
In order to address and manage ICT risk, financial entities shall use and maintain updated ICT systems, protocols and tools that are:
(a) appropriate to the magnitude of operations supporting the conduct of their activities, in accordance with the proportionality principle as referred to in Article 4;
(b) reliable;
(c) equipped with sufficient capacity to accurately process the data necessary for the performance of activities and the timely provision of services, and to deal with peak orders, message or transaction volumes, as needed, including where new technology is introduced;
(d) technologically resilient in order to adequately deal with additional information processing needs as required under stressed market conditions or other adverse situations.'''
verdict = "rejected"
