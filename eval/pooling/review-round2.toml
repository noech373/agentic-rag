[[chunks]]
question_id = "job-applicant-ranking-high-risk"
chunk = "ai-act#361"
question = "We use an AI tool to rank job candidates. Is it considered high-risk under the AI Act?"
answer = "Yes: AI systems used for the recruitment or selection of people, in particular to filter applications and evaluate candidates, are listed in Annex III (point 4(a)), and Annex III systems are considered high-risk (AI Act, Article 6(2)). The derogation of Article 6(3) (narrow procedural task, etc.) does not help if the tool performs profiling of natural persons, in which case it is always high-risk; a candidate-ranking tool will typically do so."
facts = [
  "intended to be used for the recruitment or selection of natural persons, in particular to place targeted job advertisements | in particular for the recruitment and selection of persons, for making decisions affecting terms of the work-related relationship",
  "AI systems referred to in Annex III shall be considered to be high-risk",
  "shall always be considered to be high-risk where the AI system performs profiling of natural persons | should be considered to pose significant risks of harm to the health, safety or fundamental rights if the AI system implies profiling",
]
location = "AI Act, Annex III"
text = '''
5. Access to and enjoyment of essential private services and essential public services and benefits:
  (a) AI systems intended to be used by public authorities or on behalf of public authorities to evaluate the eligibility of natural persons for essential public assistance benefits and services, including healthcare services, as well as to grant, reduce, revoke, or reclaim such benefits and services;
  (b) AI systems intended to be used to evaluate the creditworthiness of natural persons or establish their credit score, with the exception of AI systems used for the purpose of detecting financial fraud;
  (c) AI systems intended to be used for risk assessment and pricing in relation to natural persons in the case of life and health insurance;
  (d) AI systems intended to evaluate and classify emergency calls by natural persons or to be used to dispatch, or to establish priority in the dispatching of, emergency first response services, including by police, firefighters and medical aid, as well as of emergency healthcare patient triage systems.'''
