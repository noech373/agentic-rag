[[chunks]]
question_id = "hospital-records-unavailable"
chunk = "edpb-guidelines-2021-01#12"
question = "Our hospital's patient files were unreachable for a day and a half after a cyber-attack. Do we have to report that as a breach?"
answer = "Yes: medical records unavailable for 30 hours because of a cyber-attack must be notified to the supervisory authority, as a high risk to patients' well-being and privacy may occur, and the affected individuals must be told too (EDPB Guidelines 9/2022, example viii; EDPB Guidelines 01/2021, case 03)."
facts = [
  "the hospital is obliged to notify as high-risk to patient's well-being and privacy may occur | if critical medical data about patients are unavailable, even temporarily, this could present a risk | A notification to the SA is considered necessary, as special categories of personal data are involved",
  "Yes, report to the affected individuals | Informing the data subjects about the breach is necessary due to the impact for the patients",
]
location = "EDPB Guidelines 01/2021, 2.2 CASE No. 02: Ransomware without proper backup, p. 10"
text = '''
One of the computers used by an agricultural company was exposed to a ransomware attack and its data was encrypted by the attacker. The company is using the expertise of an external cybersecurity company to monitor their network. Logs tracing all data flows leaving the company (including outbound email) are available. After analysing the logs and the data the other detection systems have collected the internal investigation aided by the cybersecurity company determined that the perpetrator only encrypted the data, without exfiltrating it. The logs show no outward data flow in the timeframe of the attack. The personal data affected by the breach relates to the employees and clients of the company, a few dozen individuals altogether. No special categories of data were affected. No backup was available in an electronic form. Most of the data was restored from paper backups. The restoration of the data took 5 working days and led to minor delays in the delivery of orders to customers.'''
