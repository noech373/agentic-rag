[project]
name = "agentic-rag"
version = "0.1.0"
description = "Production-grade agentic RAG over EU regulatory compliance documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "noech373" }]
requires-python = ">=3.14"
# Runtime dependencies are added with `uv add <pkg>` only when a phase needs them.
dependencies = [
    "docling-core>=2.103.1",
    # Pinned to one minor version: pdf.py imports private Docling modules, and a new version
    # invalidates the conversion cache (~13 min to rebuild). Update by hand.
    "docling-slim[convert-core,format-pdf,models-local]>=2.141.0,<2.142",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.36.1",
    "opencv-python-headless>=5.0.0.93",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdfium2>=5.14.0",
    "sqlalchemy>=2.1.5",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "typer>=0.26.8,<0.27", # docling-core 2.103 requires typer<0.27
]

[project.scripts]
agentic-rag = "agentic_rag.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-lxml>=2026.2.16",
]

# torch and torchvision come from the CPU-only PyTorch index: the default PyPI wheels pull
# several GB of CUDA libraries. A source only applies to direct dependencies, so both are
# declared in `dependencies` even though only Docling imports them.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true # only used by the packages above

[build-system]
requires = ["uv_build>=0.12.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # isort: import ordering
    "N",   # pep8-naming
    "UP",  # pyupgrade: modern syntax for the target Python version
    "B",   # flake8-bugbear: likely bugs (mutable default args, ...)
    "S",   # flake8-bandit: security smells (hardcoded secrets, SQL built with f-strings, ...)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # `assert` is how pytest works

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "integration: needs external services (Postgres running in Docker)",
    "eval: LLM-based evaluation, slow and calls paid APIs",
]
