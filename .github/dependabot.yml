# Dependabot opens pull requests when a pinned dependency has a new version.
# CI runs on each of these pull requests, so an update is only merged if everything passes.
version: 2

updates:
  - package-ecosystem: github-actions # SHA-pinned actions in .github/workflows/
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a week pass before adopting a release (time for a compromise to surface)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv # pyproject.toml and uv.lock
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch: # one PR for all non-breaking updates; majors get their own PR
        update-types: [minor, patch]

  - package-ecosystem: pre-commit # `rev` fields in .pre-commit-config.yaml
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
