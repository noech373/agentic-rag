# Public corpus: where to download each source document and its expected SHA-256.
# The documents are not committed. `uv run agentic-rag download` fetches them into data/corpus/
# and rejects any file whose checksum differs, so every checkout ingests exactly the same bytes
# (the evaluation dataset depends on it). A source that changes upstream fails loudly instead
# of silently changing the answers.
#
# EU legal acts come from Cellar, the Publications Office's repository for machine access
# (eur-lex.europa.eu blocks scripts with a JavaScript challenge). Each URL pins one manifestation
# (the original Official Journal text in English, XHTML).
#
# Reuse: EU legal acts under Commission Decision 2011/833/EU; EDPB, ENISA and ESAs documents
# under their reuse notices; CNIL GDPR Developer Guide under GPL-3.0.


